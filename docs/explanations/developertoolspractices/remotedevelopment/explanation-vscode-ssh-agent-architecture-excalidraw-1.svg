<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">VSCode remote-over-SSH: stager installs agent; WebSocket back-channel to local front-end</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="105.2">Your laptop</tspan><tspan x="52.0" y="122.7">VSCode front-end (UI)</tspan><tspan x="52.0" y="140.2">runs the bash snippet stager</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="512.0" y="105.2">Remote host (dev server / Fly Machine)</tspan><tspan x="512.0" y="122.7">VSCode agent + Node binary installed</tspan><tspan x="512.0" y="140.2">FS access, file edits, PTY spawn, self-persist</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="320.0" y="106.2">SSH (stager + port-forward)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#e8590c" text-anchor="start"><tspan x="320.0" y="186.2">WebSockets back to front-end</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="241.2">Contrast: Emacs Tramp lives off the land on the SSH connection (no installed agent).</tspan><tspan x="40.0" y="258.7">VSCode installs Node + agent -&gt; capability profile = remote code execution with persistence.</tspan><tspan x="40.0" y="276.2">Audit before pointing at shared/production hosts; for agentic loops prefer a disposable instance.</tspan></text>
</svg>
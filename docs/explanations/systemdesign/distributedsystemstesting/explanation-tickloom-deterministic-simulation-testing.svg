<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="39.2">Chaos/Jepsen vs Deterministic Simulation Testing</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="109.4">Live fault injection</tspan><tspan x="140.0" y="131.9">(Jepsen, chaos engineering)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="162.8">real wall clock</tspan><tspan x="140.0" y="182.8">OS thread scheduling</tspan><tspan x="140.0" y="202.8">real network + disk</tspan><tspan x="140.0" y="222.8">unseeded fault schedule</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="272.8">Same fault → different</tspan><tspan x="140.0" y="292.8">execution trace per run.</tspan><tspan x="140.0" y="312.8">Bug found, not reproducible.</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="640.0" y="109.4">Deterministic simulation (Tickloom)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="640.0" y="162.8">single-threaded tick loop</tspan><tspan x="640.0" y="182.8">simulated clock / network / FS</tspan><tspan x="640.0" y="202.8">seeded fault injector</tspan><tspan x="640.0" y="222.8">production handlers unchanged</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="640.0" y="272.8">seed S ⇒ identical trace,</tspan><tspan x="640.0" y="292.8">always reproducible.</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="465.0" y="176.2">replace</tspan><tspan x="465.0" y="193.7">nondeterminism</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="640.0" y="397.8">Consistency checker (Jepsen-style):</tspan><tspan x="640.0" y="417.8">linearizability + crash durability over</tspan><tspan x="640.0" y="437.8">many seeded fault sequences = fitness function</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="960.0" y="307.8">Governed page served —</tspan><tspan x="960.0" y="327.8">always a page, even on LLM fail</tspan></text>

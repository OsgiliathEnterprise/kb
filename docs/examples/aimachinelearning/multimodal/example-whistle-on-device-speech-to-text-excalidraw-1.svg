<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="91.2">Front end</tspan><tspan x="52.0" y="108.7">80 log-mel bins (25 ms win,</tspan><tspan x="52.0" y="126.2">10 ms hop) → conv stem ×3 halving</tspan><tspan x="52.0" y="143.7">→ 375 frames @ 80 ms</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="352.0" y="91.2">Encoder (shared w/ Needle)</tspan><tspan x="352.0" y="108.7">8 Simple Attention blocks,</tspan><tspan x="352.0" y="126.2">mHC lanes + Monarch Hadamard MLP</tspan><tspan x="352.0" y="143.7">non-causal attention</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="672.0" y="91.2">Decoder (laddered)</tspan><tspan x="672.0" y="108.7">8 blocks width 512, GQA 8q:2kv,</tspan><tspan x="672.0" y="126.2">engram @ layers 3 &amp; 7</tspan><tspan x="672.0" y="143.7">+ gated cross-attention per layer</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="672.0" y="261.2">Beam search ×5</tspan><tspan x="672.0" y="278.7">length-normalised log prob,</tspan><tspan x="672.0" y="296.2">Aho-Corasick keyword biasing</tspan><tspan x="672.0" y="313.7">vocab: 8,192 pieces + 7 lang tokens</tspan></text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="36.0 -9.0 848.0 361.8" width="848" height="362">
<rect x="36.0" y="-9.0" width="848.0" height="361.8" fill="#ffffff"/>
<rect x="60.0" y="60.0" width="320.0" height="190.0" rx="8" fill="#ffe8cc" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="540.0" y="60.0" width="320.0" height="190.0" rx="8" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="1.5"/>
<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 380.0 150.0 L 540.0 150.0"/><line x1="540.0" y1="150.0" x2="527.4" y2="143.9"/><line x1="540.0" y1="150.0" x2="527.4" y2="156.1"/></g>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="27.8">DuckLake: metadata as SQL rows instead of manifest file trees</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="85.4">Traditional lake (Iceberg/Delta)</tspan><tspan x="75.0" y="101.7"> </tspan><tspan x="75.0" y="117.9">query planner:</tspan><tspan x="75.0" y="134.2">  list object storage</tspan><tspan x="75.0" y="150.4">  parse manifest tree</tspan><tspan x="75.0" y="166.7">  parse delete files</tspan><tspan x="75.0" y="182.9">  -&gt; THEN read Parquet</tspan><tspan x="75.0" y="199.2"> </tspan><tspan x="75.0" y="215.4">many small files =&gt; slow planning</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="555.0" y="85.4">DuckLake</tspan><tspan x="555.0" y="101.7"> </tspan><tspan x="555.0" y="117.9">query planner:</tspan><tspan x="555.0" y="134.2">  SELECT on catalog tables</tspan><tspan x="555.0" y="150.4">  (Postgres / SQLite / DuckDB)</tspan><tspan x="555.0" y="166.7">  -&gt; exact Parquet file list</tspan><tspan x="555.0" y="182.9"> </tspan><tspan x="555.0" y="199.2">Parquet files never change,</tspan><tspan x="555.0" y="215.4">only the catalog</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1971c2" text-anchor="start"><tspan x="60.0" y="290.4">Small-file handling: compaction glues files together; inlining writes small</tspan><tspan x="60.0" y="306.6">batches directly into the catalog, flushed to Parquet later;</tspan><tspan x="60.0" y="322.9">Puffin deletion vectors avoid data rewrites. Data plane stays plain Parquet.</tspan></text>
</svg>
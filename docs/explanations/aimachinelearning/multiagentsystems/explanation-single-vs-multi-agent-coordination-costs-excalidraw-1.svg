<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">Why swarms degrade: pairwise coordination channels</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="115.0" y="97.3">1 agent</tspan><tspan x="115.0" y="113.5">0 channels</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="295.0" y="97.3">5 agents</tspan><tspan x="295.0" y="113.5">10 channels</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="475.0" y="97.3">8 agents</tspan><tspan x="475.0" y="113.5">28 channels</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="655.0" y="97.3">10 agents</tspan><tspan x="655.0" y="113.5">45 channels</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="182.8">n(n-1)/2 agreement channels grow SUPERLINEARLY: each agent must align its output</tspan><tspan x="40.0" y="202.8">with every other agent's output. A swarm's score dropped to 9/28 with 152 files</tspan><tspan x="40.0" y="222.8">whose service boundaries didn't line up. Pipeline: each handoff passes only a</tspan><tspan x="40.0" y="242.8">SUMMARY; what's lost never comes back.</tspan></text>
</svg>
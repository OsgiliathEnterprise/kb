<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="30.4">Argo CD: from Git to live — CI, Git, and sync are three separate responsibilities</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="96.2">CI: test + build container image</tspan><tspan x="70.0" y="113.7">+ push to registry  (does NOT deploy)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="208.2">Git: manifest updated</tspan><tspan x="70.0" y="225.7">image: demo-app:v1  -&gt;  demo-app:v2</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="320.2">Argo CD compares desired (Git) vs live</tspan><tspan x="70.0" y="337.7">state  -&gt;  OutOfSync (comparison result only)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="432.2">Review: argocd app get / app diff demo-app</tspan><tspan x="70.0" y="449.7">(diff exit code 1 = differences found)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="544.2">Apply: argocd app sync demo-app</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="656.2">Synced != Healthy: verify revision applied,</tspan><tspan x="70.0" y="673.7">rollout ready, user path, logs &amp; monitoring</tspan></text>
</svg>
<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 500.0 508.0 L 500.0 478.0"/><line x1="500.0" y1="478.0" x2="495.4" y2="487.4"/><line x1="500.0" y1="478.0" x2="504.6" y2="487.4"/></g>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="28" fill="#1e1e1e" text-anchor="start"><tspan x="180.0" y="42.4">Autonomous Agent Containment Stack</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="165.0" y="116.2">L5  Observe the boundary: audit log on separate failure domain, alerts on DNS entropy / egress denials / budget exhaust</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="165.0" y="196.2">L4  Action budgets + dispatch choke point; human gate on irreversible actions</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="165.0" y="276.2">L3  Provenance tags on every input; untrusted content never authorizes sensitive actions</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="165.0" y="356.2">L2  Default-deny egress: domain allowlist, HTTPS only, no raw IPs, no 169.254/16, proxies ignored</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="165.0" y="436.2">L1  Isolate runtime: microVM / locked container, read-only rootfs, seccomp, no metadata endpoint, short-lived creds</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="340.0" y="536.2">Agent run (tools, network, long-horizon loop)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#495057" text-anchor="start"><tspan x="510.0" y="489.6">every action passes the stack</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="34.4">Kimi K3 (~3T params, 4-bit) on Cerebras WSE-3T wafers</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="57.6">69 linear layers (no KV cache, 2 per wafer) + 24 dense layers (1 per wafer + 8-bit KV cache) = 59 wafers</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="125.0" y="134.2">W1</tspan><tspan x="125.0" y="150.4">linear L1-2</tspan><tspan x="125.0" y="166.7">(2x16 GB)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="305.0" y="134.2">W2</tspan><tspan x="305.0" y="150.4">linear L3-4</tspan><tspan x="305.0" y="166.7">(2x16 GB)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="485.0" y="134.2">W3</tspan><tspan x="485.0" y="150.4">linear L5-6</tspan><tspan x="485.0" y="166.7">(2x16 GB)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="620.0" y="150.4">...</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="785.0" y="134.2">W35</tspan><tspan x="785.0" y="150.4">last linear</tspan><tspan x="785.0" y="166.7">(2x16 GB)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="965.0" y="134.2">W36-59</tspan><tspan x="965.0" y="150.4">dense + KV cache</tspan><tspan x="965.0" y="166.7">(16 GB + 28 GB)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="1130.0" y="142.3">next</tspan><tspan x="1130.0" y="158.5">token</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="209.6">only activations cross wafers - RDMA over Ethernet, ~2 microseconds per hop; weights stay on-chip (44 GB SRAM)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="610.0" y="269.6">Pipeline stages run different requests concurrently: while stage 3 works request A, stage 2 works request B, stage 1 works request C.</tspan><tspan x="610.0" y="284.6">Each stage processes a micro-batch, so requests in flight ~= number of stages x micro-batch size (e.g. ~13 tokens).</tspan><tspan x="610.0" y="299.6">Concurrency ceiling set by SRAM left for KV cache on dense-layer wafers; requests stream through like a conveyor, not a GPU batch.</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="930.0" y="242.3">snapshot = { nextTxid,</tspan><tspan x="930.0" y="258.5">activeTxids } (frozen at begin())</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="520.0" y="322.8">A snapshot is NOT a copy of the data — it is two numbers and a set:</tspan><tspan x="520.0" y="342.8">where the txid counter stood at begin(), plus who was in flight then.</tspan><tspan x="520.0" y="362.8">The DATA never freezes; only the RULES FOR JUDGING STAMPS do.</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#e03131" text-anchor="middle"><tspan x="790.0" y="243.7">Committed (often by Claude co-authored commit).</tspan><tspan x="790.0" y="261.2">Global gitignore only — repo .gitignore never touched.</tspan><tspan x="790.0" y="278.7">1,122 public copies with real secrets</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="395.0" y="243.7">Permanent exposure: git history (734 more</tspan><tspan x="395.0" y="261.2">secrets in deleted versions) + 211 forks.</tspan><tspan x="395.0" y="278.7">Delete-the-file does not undo it → rotate first</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="110.0" y="243.7">Scanners miss</tspan><tspan x="110.0" y="261.2">1/5: passwords</tspan><tspan x="110.0" y="278.7">in commands</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="29.4">Claude Code &quot;Don't Ask Again&quot; secret leak path (Apiiro, Nov 2026)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="650.0" y="377.4">Defenses: keep secrets off the command line ($VAR / ~/.pgpass / SSH keys / fixed wrapper script),</tspan><tspan x="650.0" y="394.9">approve patterns not exact commands, repo .gitignore + pre-commit scans of .claude/settings*.json</tspan></text>

<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 370.0 115.0 L 430.0 115.0"/><line x1="430.0" y1="115.0" x2="417.4" y2="108.9"/><line x1="430.0" y1="115.0" x2="417.4" y2="121.1"/></g>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="27.8">DuckDB 2.0 async I/O — download pool vs inline download</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="77.6">DuckDB 1.5.5</tspan><tspan x="50.0" y="92.6">18 workers each:</tspan><tspan x="50.0" y="107.6">download → wait → decode</tspan><tspan x="50.0" y="122.6">CPU idle while waiting</tspan><tspan x="50.0" y="137.6">no download in flight while decoding</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="440.0" y="77.6">DuckDB 2.0 alpha</tspan><tspan x="440.0" y="92.6">separate pool only downloads</tspan><tspan x="440.0" y="107.6">keeps dozens of row groups in flight</tspan><tspan x="440.0" y="122.6">workers only decode</tspan><tspan x="440.0" y="137.6">network AND CPU busy at once</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="11" fill="#e8590c" text-anchor="start"><tspan x="372.0" y="103.8">read_ahead_depth = -1 (default)</tspan><tspan x="372.0" y="117.5">0 = old behaviour</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="227.6">S3, 2.2 GB Parquet, 2268 row groups, one column (M5 laptop, home internet)</tspan><tspan x="50.0" y="242.6">1.5.5: 18.8 s   →   2.0 alpha: 7.7 s      23 files 13.6 GB: 11.8 s → 3.9 s      CSV: 116 s → 55 s</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="327.6">also faster: recursive CTE reads table once (20k-commit walk: 1.8–16 s → 0.10 s)</tspan><tspan x="50.0" y="342.6">VARIANT shredding: 2.7× smaller than JSON text, ~6× faster on field queries (lists not yet)</tspan></text>
</svg>
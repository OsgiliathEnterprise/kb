<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="400.0" y="32.8">Jev Ultrafast: One Fused Request per Decision Cycle</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="155.0" y="127.1">Page snapshot</tspan><tspan x="155.0" y="142.1">(one browser call)</tspan><tspan x="155.0" y="157.1">visible controls + DOM node refs</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="440.0" y="119.6">Element table (indexed)</tspan><tspan x="440.0" y="134.6">[1] button Change ticket type</tspan><tspan x="440.0" y="149.6">[2] combobox Where from?</tspan><tspan x="440.0" y="164.6">[3] combobox Where to?</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="725.0" y="112.1">ONE TypeSafe request</tspan><tspan x="725.0" y="127.1">operation head</tspan><tspan x="725.0" y="142.1">click_target / type_text_target /</tspan><tspan x="725.0" y="157.1">select_target heads (speculative,</tspan><tspan x="725.0" y="172.1">only compatible elements)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="1010.0" y="127.1">Browser executes</tspan><tspan x="1010.0" y="142.1">CLICK [7]</tspan><tspan x="1010.0" y="157.1">or TYPE_TEXT [3] -&gt; small LLM writes text only then</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="320.0" y="257.1">Why fast: no screenshots in default loop (structured state),</tspan><tspan x="320.0" y="272.1">two decisions per round trip, DOM-node refs instead of generated selectors,</tspan><tspan x="320.0" y="287.1">combobox waits capped at 200ms, hidden-tab focus emulation</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="885.0" y="257.1">Safety: model output never becomes selectors/coordinates/</tspan><tspan x="885.0" y="272.1">shell commands/executable JS; text-helper output must parse</tspan><tspan x="885.0" y="287.1">as small JSON before typing; targets rechecked for occlusion</tspan></text>
</svg>
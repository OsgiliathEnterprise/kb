<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="19" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="35.2">Zero-API-key model gateway: Entra Agent ID JWT -&gt; LiteLLM custom_auth -&gt; both clouds</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="109.6">Agent (GCP or Azure)</tspan><tspan x="50.0" y="124.6">Entra Agent ID -&gt;</tspan><tspan x="50.0" y="139.6">bearer JWT (aud=</tspan><tspan x="50.0" y="154.6">a2a-llm-gateway,</tspan><tspan x="50.0" y="169.6">role LLM.Invoke)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="310.0" y="110.4">LiteLLM on Cloud Run</tspan><tspan x="310.0" y="126.7">+ Redis sidecar</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="310.0" y="220.4">LiteLLM on Azure</tspan><tspan x="310.0" y="236.7">Container Apps</tspan><tspan x="310.0" y="252.9">+ Redis sidecar</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="310.0" y="329.6">Shared Postgres (Cloud SQL)</tspan><tspan x="310.0" y="344.6">teams/agents, allowed models, usage</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="630.0" y="110.4">Azure OpenAI</tspan><tspan x="630.0" y="126.7">(gpt-4.1-mini)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="630.0" y="220.4">Vertex AI</tspan><tspan x="630.0" y="236.7">(gemini-3.1-flash-lite)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#495057" text-anchor="start"><tspan x="850.0" y="149.6">NO api_key lines:</tspan><tspan x="850.0" y="164.6">GCP via Cloud Run</tspan><tspan x="850.0" y="179.6">workload identity,</tspan><tspan x="850.0" y="194.6">Azure via managed</tspan><tspan x="850.0" y="209.6">identity. Either gateway</tspan><tspan x="850.0" y="224.6">calls EITHER model family;</tspan><tspan x="850.0" y="239.6">killing one cloud's</tspan><tspan x="850.0" y="254.6">gateway fails over.</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#495057" text-anchor="start"><tspan x="630.0" y="319.6">custom_auth hook replaces virtual-key lookup:</tspan><tspan x="630.0" y="334.6">verify RS256 JWT vs JWKS (iss, aud, exp) -&gt; require</tspan><tspan x="630.0" y="349.6">role LLM.Invoke -&gt; team = claims['azp'] (agent ID)</tspan><tspan x="630.0" y="364.6">-&gt; enforce per-agent model allow-list from inventory</tspan></text>
</svg>
<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 190.0 100.0 L 220.0 100.0"/><line x1="220.0" y1="100.0" x2="210.6" y2="95.4"/><line x1="220.0" y1="100.0" x2="210.6" y2="104.6"/></g>
<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 370.0 100.0 L 400.0 100.0"/><line x1="400.0" y1="100.0" x2="390.6" y2="95.4"/><line x1="400.0" y1="100.0" x2="390.6" y2="104.6"/></g>

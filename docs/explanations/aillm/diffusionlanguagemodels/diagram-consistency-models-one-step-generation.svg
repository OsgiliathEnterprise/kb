<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="22" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="37.6">Consistency Models: diffusion walk vs one-shot endpoint jump</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="130.0" y="127.8">pure noise</tspan><tspan x="130.0" y="147.8">x_T</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="380.0" y="127.8">diffusion sampler</tspan><tspan x="380.0" y="147.8">50-1000 small steps</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="630.0" y="127.8">clean sample</tspan><tspan x="630.0" y="147.8">x_0</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="170.0" y="277.8">consistency model f(x,t)</tspan><tspan x="170.0" y="297.8">learns endpoint map</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="470.0" y="277.8">clean sample x_0</tspan><tspan x="470.0" y="297.8">ONE forward pass</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="260.0" y="260.2">x_0 = f(x_T, T)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="770.0" y="277.8">multi-step: jump -&gt; re-noise</tspan><tspan x="770.0" y="297.8">-&gt; jump (2-4 rounds)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="250.0" y="427.8">Consistency loss:</tspan><tspan x="250.0" y="447.8">L = E[d(f_theta(x_t+dt, t+dt), f_theta-(x_t, t))]</tspan><tspan x="250.0" y="467.8">f_theta- = EMA target (like BYOL / RL target)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="720.0" y="417.8">Boundary condition by construction:</tspan><tspan x="720.0" y="437.8">f = c_skip(t)*x + c_out(t)*F</tspan><tspan x="720.0" y="457.8">c_skip(eps)=1, c_out(eps)=0</tspan><tspan x="720.0" y="477.8">=&gt; f(x,eps)=x exactly</tspan></text>
</svg>
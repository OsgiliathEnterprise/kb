<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 240.0 265.0 L 310.0 265.0"/><line x1="310.0" y1="265.0" x2="297.4" y2="258.9"/><line x1="310.0" y1="265.0" x2="297.4" y2="271.1"/></g>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="140.0" y="218.7">Interactive codex session</tspan><tspan x="140.0" y="236.2">(since 0.157.0,</tspan><tspan x="140.0" y="253.7">by default)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="435.0" y="85.0">1. Starts managed daemon</tspan><tspan x="435.0" y="102.5">codex app-server --managed-daemon</tspan><tspan x="435.0" y="120.0">reparented to PID 1, survives</tspan><tspan x="435.0" y="137.4">all windows closed</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="435.0" y="204.9">2. Copies ~374 MB platform package</tspan><tspan x="435.0" y="222.4">to ~/.codex/packages/app-server-daemon/</tspan><tspan x="435.0" y="239.9">runs daemon FROM the copy</tspan><tspan x="435.0" y="257.4">(version decoupled from CLI)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="435.0" y="324.9">3. Detached updater pid-update-loop</tspan><tspan x="435.0" y="342.4">checks 5 min after start, then hourly</tspan><tspan x="435.0" y="359.9">downloads releases, restarts backend</tspan><tspan x="435.0" y="377.4">can kill active turns (60 s drain)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="435.0" y="453.7">4. Pins the starting session's environment</tspan><tspan x="435.0" y="471.2">(HTTPS_PROXY, cwd, terminal)</tspan><tspan x="435.0" y="488.7">all later sessions inherit it</tspan></text>
</svg>
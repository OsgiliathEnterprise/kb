<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="34.4">Scaling Git service architectures: 3PC vs shared-manifest WAL vs Pando</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="210.0" y="102.0">3PC: full replicas + coordinator</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="210.0" y="166.2">coord</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="110.0" y="245.4">replica A</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="210.0" y="245.4">replica B</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="310.0" y="245.4">replica C</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="210.0" y="322.4">Bottleneck: ref updates serialize;</tspan><tspan x="210.0" y="339.9">quorum rounds on push path</tspan></text>



<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="570.0" y="102.0">WAL: blob store + shared manifest</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="495.0" y="157.3">blob store</tspan><tspan x="495.0" y="173.5">(packs)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="650.0" y="157.3">manifest</tspan><tspan x="650.0" y="173.5">(CAS)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="570.0" y="322.4">Bottleneck: every push CASes the</tspan><tspan x="570.0" y="339.9">same manifest, even unrelated branches</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="950.0" y="102.0">Pando: per-ref versions, causal consistency</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="865.0" y="157.3">blob store</tspan><tspan x="865.0" y="173.5">(immutable packs)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="1035.0" y="157.3">metadata store</tspan><tspan x="1035.0" y="173.5">(ref versions + deps)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="950.0" y="322.4">Scales: writes per-branch, no global order;</tspan><tspan x="950.0" y="339.9">packs reused across fetches (reads cached)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="890.0" y="146.6">ref ver.</tspan><tspan x="890.0" y="161.6">-&gt; pack</tspan></text>

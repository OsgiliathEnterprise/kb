<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 -4.0 808.0 296.0" width="808" height="296">
<rect x="16.0" y="-4.0" width="808.0" height="296.0" fill="#ffffff"/>
<rect x="40.0" y="80.0" width="170.0" height="90.0" rx="8" fill="#d3f261" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="300.0" y="80.0" width="190.0" height="90.0" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="580.0" y="80.0" width="210.0" height="90.0" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.5"/>
<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 210.0 125.0 L 300.0 125.0"/><line x1="300.0" y1="125.0" x2="287.4" y2="118.9"/><line x1="300.0" y1="125.0" x2="287.4" y2="131.1"/></g>
<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 490.0 125.0 L 580.0 125.0"/><line x1="580.0" y1="125.0" x2="567.4" y2="118.9"/><line x1="580.0" y1="125.0" x2="567.4" y2="131.1"/></g>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">NixOS memory pressure path: RAM -&gt; zswap (zstd) -&gt; disk swap -&gt; hibernate</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="107.2">RAM</tspan><tspan x="52.0" y="124.7">hot pages live here</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="312.0" y="107.2">zswap pool (RAM)</tspan><tspan x="312.0" y="124.7">compressed with zstd</tspan><tspan x="312.0" y="142.2">boot.zswap.enable = true</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="592.0" y="107.2">disk swap</tspan><tspan x="592.0" y="124.7">partition or btrfs subvol file</tspan><tspan x="592.0" y="142.2">S4 hibernate writes state here</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="211.2">vm.swappiness = 100 (SSD): kernel prefers swapping over filesystem paging</tspan><tspan x="40.0" y="228.7">NOT zramSwap.enable — that is a compressed RAM block device replacing disk swap,</tspan><tspan x="40.0" y="246.2">the opposite of this design</tspan></text>
</svg>
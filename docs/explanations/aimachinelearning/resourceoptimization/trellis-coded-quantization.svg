<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#495057" text-anchor="start"><tspan x="40.0" y="410.4">Each transition label = codeword from a shared codebook; a long weight sequence = one trellis path.</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#495057" text-anchor="start"><tspan x="40.0" y="435.4">Viterbi search minimizes reconstruction error globally (not per block) -&gt; near rate-distortion at 2-3 bits/w.</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#495057" text-anchor="start"><tspan x="40.0" y="460.4">NariQ = trellis PTQ calibrated on real coding-agent traces; needs the nari llama.cpp fork (new tensor types).</tspan></text>

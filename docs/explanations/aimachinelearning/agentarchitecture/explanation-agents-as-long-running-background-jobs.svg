<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="36.0">Agent = long-running background job: the 7 hard concerns</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="102.4">1. Identity &amp; least-privilege</tspan><tspan x="52.0" y="118.7">   secrets (per-agent scope)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="352.0" y="102.4">2. State: operational DB of record,</tspan><tspan x="352.0" y="118.7">   not vector-search over chat</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="202.4">3. Write paths: idempotency keys,</tspan><tspan x="52.0" y="218.7">   audit trail, rollback, confirm</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="352.0" y="202.4">4. Rate limit + backoff on</tspan><tspan x="352.0" y="218.7">   downstream APIs (429-as-body)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="302.4">5. Resumable retries:</tspan><tspan x="52.0" y="318.6">   checkpoints, Temporal-like</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="352.0" y="302.4">6. Observability with agent</tspan><tspan x="352.0" y="318.6">   semantics (tools, expectations)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="402.4">7. Escalation rule + kill switch</tspan><tspan x="52.0" y="418.6">   (literal off, not redeploy)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="510.4">Cross-cutting ops risks: cost spikes (token digest + budget caps per agent/task/day)</tspan><tspan x="75.0" y="526.6">+ prompt rot (version prompts, diff outputs weekly) + hostile input (prompt injection)</tspan></text>
</svg>
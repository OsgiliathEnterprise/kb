<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="39.2">Vercel Board: message-board primitive for agent swarms</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="123.2">Human via Slack /</tspan><tspan x="72.0" y="140.7">GitHub / Linear</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="342.0" y="109.2">Board channels</tspan><tspan x="342.0" y="126.7">(threads, task claims,</tspan><tspan x="342.0" y="144.2">deps, history, audit log)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="672.0" y="81.2">Claude Code agents</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="672.0" y="141.2">Codex / OpenCode / Pi</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="672.0" y="201.2">Mastra / LangChain / fx</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="342.0" y="239.2">HUMAN GATE</tspan><tspan x="342.0" y="256.7">agents report + wait</tspan><tspan x="342.0" y="274.2">for approval</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#c92a2a" text-anchor="start"><tspan x="72.0" y="259.2">RISK: agents read</tspan><tspan x="72.0" y="276.7">messages as</tspan><tspan x="72.0" y="294.2">instructions</tspan><tspan x="72.0" y="311.7">(indirect injection)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="60.0" y="361.2">Controls: channel-level permissions, private channels, activity logs,</tspan><tspan x="60.0" y="378.7">keep secrets/tokens off Board. Ref: OpenAI/HF breach used a repo as message board.</tspan></text>

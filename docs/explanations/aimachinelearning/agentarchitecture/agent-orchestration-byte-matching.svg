<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="27.8">15+ agents for months — byte-matching as the verification harness</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="77.6">15+ worker agents</tspan><tspan x="50.0" y="92.6">(Claude Code CLI / Codex CLI)</tspan><tspan x="50.0" y="107.6">1 GitHub issue per .cpp file</tspan><tspan x="50.0" y="122.6">shared Discord + CI failure webhook</tspan><tspan x="50.0" y="137.6">hourly cron re-injects instruction doc</tspan><tspan x="50.0" y="152.6">compaction threshold 90% → 42%</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="27.8">celld DST — control execution order, replay by seed</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="77.6">production code (same in prod)</tspan><tspan x="50.0" y="92.6">cell = Workers app code + SQLite</tspan><tspan x="50.0" y="107.6">storage = S3-compatible</tspan><tspan x="50.0" y="122.6">KEY: event selection is separate</tspan><tspan x="50.0" y="137.6">from event handling</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="410.0" y="77.6">simulator (seeded RNG)</tspan><tspan x="410.0" y="92.6">reorders events</tspan><tspan x="410.0" y="107.6">schedules async tasks</tspan><tspan x="410.0" y="122.6">delays/fails storage ops</tspan><tspan x="410.0" y="137.6">advances simulated clock</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="770.0" y="77.6">invariant checker</tspan><tspan x="770.0" y="92.6">state predicates after EVERY action</tspan><tspan x="770.0" y="107.6">(not just end state)</tspan><tspan x="770.0" y="122.6">observed responses + stored data</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="410.0" y="257.6">bug found: wake-entry race</tspan><tspan x="410.0" y="272.6">old alarm cleanup deletes the wake entry</tspan><tspan x="410.0" y="287.6">the new 10:05 alarm still needs</tspan><tspan x="410.0" y="302.6">alarm set in SQLite but no entry</tspan><tspan x="410.0" y="317.6">to reactivate the cell after restart</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="257.6">fix: one wake entry per new alarm</tspan><tspan x="50.0" y="272.6">delayed deletion only removes its own</tspan><tspan x="50.0" y="287.6">old entries removed once confirmed</tspan><tspan x="50.0" y="302.6">failing seed → replayed regression test</tspan></text>
</svg>
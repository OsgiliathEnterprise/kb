<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="36.0">The Jiff DateTime Onion: compose up to a ZonedDateTime</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="145.0" y="117.5">civil::Date</tspan><tspan x="145.0" y="134.9">plain Gregorian date</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="345.0" y="117.5">civil::Time</tspan><tspan x="345.0" y="134.9">clock time, ns</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="245.0" y="217.4">civil::DateTime</tspan><tspan x="245.0" y="234.9">(naive: no location)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="145.0" y="321.2">Timestamp</tspan><tspan x="145.0" y="338.7">instant: ns since</tspan><tspan x="145.0" y="356.2">Unix epoch</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#b08968" text-anchor="middle"><tspan x="585.0" y="211.2">TimeZone</tspan><tspan x="585.0" y="228.7">IANA rules: maps instant</tspan><tspan x="585.0" y="246.2">&lt;-&gt; civil time (DST!)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#7048e8" text-anchor="middle"><tspan x="400.0" y="431.2">ZonedDateTime</tspan><tspan x="400.0" y="448.7">Timestamp + civil::DateTime</tspan><tspan x="400.0" y="466.2">+ TimeZone</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#495057" text-anchor="start"><tspan x="60.0" y="510.4">Same ZonedDateTime from either side:</tspan><tspan x="60.0" y="526.6">civil dt .in_tz(tz)  ==  Timestamp .in_tz(tz)   |   folds/gaps resolved via compatible/earlier/later/unambiguous</tspan></text>

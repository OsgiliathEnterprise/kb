<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="150.0" y="36.0">unkernel: Linux kernel compiled to WebAssembly, unmodified aarch64 user space in the browser</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#868e96" text-anchor="start"><tspan x="115.0" y="91.2">Browser tab (no server-side emulation)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="144.0">WASM module = Linux 7.3.4 kernel</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="170.4">arch/wasm (from linux-wasm)</tspan><tspan x="160.0" y="186.7">boot to shell &lt; 1s</tspan><tspan x="160.0" y="202.9">SMP: 1 CPU per Web Worker</tspan><tspan x="160.0" y="219.2">JIT: hot aarch64 guest code -&gt; WASM</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="372.0">virtio/virt devices</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="398.4">virtio-gpu -&gt; virglrenderer/Mesa -&gt; WebGL2</tspan><tspan x="160.0" y="414.6">kwvk-naga (Vulkan 1.0) -&gt; WebGPU</tspan><tspan x="160.0" y="430.9">ALSA /dev/dsp -&gt; Web Audio</tspan><tspan x="160.0" y="447.1">Wisp proxy -&gt; internet</tspan><tspan x="160.0" y="463.4">/dev/fb0 + input -&gt; display window</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="575.0" y="149.2">Web Worker x N (vCPUs)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="575.0" y="229.2">browser JIT (WASM compile)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="575.0" y="379.2">WebGL2 / WebGPU canvas</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="575.0" y="458.4">browser storage: /data disk + root overlay (EROFS distro base)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#495057" text-anchor="start"><tspan x="140.0" y="570.4">distros: Debian/Alpine EROFS read-only images, per-distro overlay; suspend/resume saves full session</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="34.4">RFC 8693 token exchange via broker: subject (user) + actor (agent), map-gated delivery</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="180.0" y="36.0">Standard residual (equal-weight sum)  vs  DeepCrossAttention (learned per-token routing)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="125.0" y="102.8">Standard: y_out = x + f(x)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="138.0" y="155.0">Layer N (sum: input + output)</tspan></text>

<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 300.0 95.0 L 378.0 95.0"/><line x1="378.0" y1="95.0" x2="365.4" y2="88.9"/><line x1="378.0" y1="95.0" x2="365.4" y2="101.1"/></g>
<g stroke="#e03131" stroke-width="1.5" fill="none"><path d="M 620.0 95.0 L 698.0 65.0"/><line x1="698.0" y1="65.0" x2="684.1" y2="63.8"/><line x1="698.0" y1="65.0" x2="688.5" y2="75.2"/></g>
<g stroke="#2f9e44" stroke-width="1.5" fill="none"><path d="M 620.0 135.0 L 698.0 165.0"/><line x1="698.0" y1="165.0" x2="688.5" y2="154.8"/><line x1="698.0" y1="165.0" x2="684.1" y2="166.2"/></g>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">Vary in Cache Rules — raw-value fragmentation vs normalized variants (Cloudflare, Sept 2026)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="93.2">Requests (same intent):</tspan><tspan x="52.0" y="110.7">Accept-Language: en-US, fr;q=0.8</tspan><tspan x="52.0" y="128.2">Accept-Language: fr;q=0.8, en-GB</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="392.0" y="93.2">Origin: serves one English</tspan><tspan x="392.0" y="110.7">response for both,</tspan><tspan x="392.0" y="128.2">returns Vary: Accept-Language</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="712.0" y="63.2">Raw-value cache: 2+ cold variants</tspan><tspan x="712.0" y="80.7">of identical bytes → fragmentation</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#2f9e44" text-anchor="start"><tspan x="712.0" y="153.2">Normalize action: lowercase + q-sort</tspan><tspan x="712.0" y="170.7">→ one hot variant; normalized value</tspan><tspan x="712.0" y="188.2">forwarded to origin</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="201.2">Per-header actions: normalize (default) / passthrough (exact value matters)</tspan><tspan x="40.0" y="218.7">/ bypass (Cookie, User-Agent). Vary: * always bypasses. Origin must send</tspan><tspan x="40.0" y="236.2">Vary consistently on ALL cacheable responses incl. errors and fallbacks.</tspan></text>
</svg>
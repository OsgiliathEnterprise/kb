<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="49.2">JDK 28: Primitive Patterns Withdrawn — What Replaces Them</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="124.8">Valhalla value classes</tspan><tspan x="75.0" y="144.8">(user-defined numeric types:</tspan><tspan x="75.0" y="164.8">Celsius, Ticker, ...)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="495.0" y="124.8">JLS ch.5 conversions know only</tspan><tspan x="495.0" y="144.8">the 8 built-in primitives —</tspan><tspan x="495.0" y="164.8">no widening for custom numerics</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="975.0" y="124.8">Direction: type classes</tspan><tspan x="975.0" y="144.8">(Goetz) — types declare</tspan><tspan x="975.0" y="164.8">arithmetic/conversion contexts</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="495.0" y="284.8">Primitive patterns 6th preview</tspan><tspan x="495.0" y="304.8">(JEP 8393282) depends on these</tspan><tspan x="495.0" y="324.8">unresolved interactions</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="495.0" y="444.8">WITHDRAWN in JDK 28</tspan><tspan x="495.0" y="464.8">(gone even with --enable-preview)</tspan><tspan x="495.0" y="484.8">→ preview code breaks on upgrade</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="444.8">Replacement plan (Amber):</tspan><tspan x="75.0" y="464.8">Constant Patterns — may return</tspan><tspan x="75.0" y="484.8">once type classes land</tspan></text>

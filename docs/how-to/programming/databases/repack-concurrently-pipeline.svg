<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="39.2">PostgreSQL 19: REPACK (CONCURRENTLY) — online table rebuild</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="136.2">1. Start logical decoding</tspan><tspan x="75.0" y="153.7">slot on table WAL</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="320.0" y="136.2">2. Create + populate</tspan><tspan x="320.0" y="153.7">shadow copy of table</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="565.0" y="136.2">3. Replay concurrent I/U/D</tspan><tspan x="565.0" y="153.7">from WAL (no triggers!)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="810.0" y="136.2">4. Brief ACCESS EXCLUSIVE</tspan><tspan x="810.0" y="153.7">lock: swap files</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="241.2">Live table: fully READABLE + WRITABLE during steps 1-3   |   vs VACUUM FULL: locked entire duration</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="276.2">Requirements: 2x disk space · WAL-logged · not partitioned · indexable PK · one REPACK per DB</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="311.2">pg_repack: external CLI + triggers   |   pg_squeeze: extension + shared_preload_libraries   |   REPACK: built-in</tspan></text>
</svg>
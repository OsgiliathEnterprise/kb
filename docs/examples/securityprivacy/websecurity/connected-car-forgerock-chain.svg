<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">Connected-car takeover chain: number plate -&gt; remote door-unlock (ForgeRock OpenIDM)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="370.0" y="102.6">Number plate (public)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="370.0" y="166.6">VIN via state registration lookup</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="370.0" y="230.6">Subscriber GUID via unauthenticated admin-tool API (hardcoded JS key)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="370.0" y="294.6">Account PII + email via /v1/account</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="370.0" y="358.6">OpenIDM admin creds found in vendor JS bundle</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="370.0" y="422.6">WAF bypass: /static%2f..%2fopenidm/... (path traversal not covered by rules)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="370.0" y="486.6">PATCH /managed/user/{guid} -&gt; replace password</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="370.0" y="550.6">MFA bypass: ROPC grant (grant_type=password) -&gt; id_token -&gt; session -&gt; app token</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="370.0" y="614.6">POST /v1/remote/route/command  {&quot;command&quot;:&quot;door-unlock&quot;} -&gt; DOORS OPEN</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="720.0" y="101.2">Root causes:</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="720.0" y="127.6">- identity stack exposed to internet</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="720.0" y="149.6">- creds shipped in JS bundles</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="720.0" y="171.6">- WAF as compensating control</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="720.0" y="193.6">- ROPC flow kept MFA optional</tspan></text>

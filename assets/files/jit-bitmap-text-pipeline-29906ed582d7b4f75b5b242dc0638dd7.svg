<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="32.8">vic-2350 race-the-beam text pipeline (RP2350, ~6 cycles/pixel budget)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="160.0" y="119.6">Double-buffered display list (vtable + bbox + payload)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="375.0" y="119.6">Sort indices by y0</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="580.0" y="119.6">Active list per scanline (insert y0=/ delete y1=)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="244.6">start(): JIT compiler expands the string into ARM code (glyph -&gt; ldr/ubfx/orr; delay-slot shuffle 4-&gt;3 cyc)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="490.0" y="244.6">render(): run JIT code -&gt; 1bpp line buffer (23 cyc/glyph + 3xheight)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="770.0" y="244.6">2nd pass: 1bpp -&gt; RGB565, sustained 1.75 cyc/pixel</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="270.0" y="364.6">Packed font: glyphs share a wide bitmap; no glyph straddles a 32-bit chunk (one ldr per row); overlap dedup 1140-&gt;960 B; 32-bit per-glyph metadata (ink x/width, left bearing, advance); lives in SRAM</tspan></text>

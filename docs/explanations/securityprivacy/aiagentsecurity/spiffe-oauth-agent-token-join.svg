<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="22" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="37.6">AI agent auth: joining SPIFFE workload identity with OAuth delegation</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="139.2">Agent</tspan><tspan x="70.0" y="156.7">(no secret at rest)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="330.0" y="139.2">SPIRE Workload API</tspan><tspan x="330.0" y="156.7">-&gt; issues SVID (X.509/JWT)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="590.0" y="139.2">Gateway</tspan><tspan x="590.0" y="156.7">verifies SPIFFE ID</tspan><tspan x="590.0" y="174.2">on the wire</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="850.0" y="139.2">Authorization server</tspan><tspan x="850.0" y="156.7">RFC 8693 exchange:</tspan><tspan x="850.0" y="174.2">subject_token=user</tspan><tspan x="850.0" y="191.7">actor_token=JWT-SVID</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="1110.0" y="139.2">Audience-restricted access token</tspan><tspan x="1110.0" y="156.7">(scopes, expiry, user sub)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="1370.0" y="139.2">Backend / MCP tool</tspan><tspan x="1370.0" y="156.7">allows the call</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="336.0">Rule: never forward the same bearer/SVID down an agent chain -</tspan><tspan x="60.0" y="361.0">mint a new audience-restricted token per hop (RFC 8707 resource indicator).</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="416.0">Valid SVID != permission: policy (CEL / gateway ACL on source.spiffeId)</tspan><tspan x="60.0" y="441.0">decides authorization; OAuth scopes decide capability.</tspan></text>

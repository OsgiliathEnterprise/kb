<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="80.0" y="49.2">JEP 546: ZGC Adaptive Heap Sizing</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="340.0" y="152.8">Workload + ZGC cycles</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="340.0" y="262.0">Measure GC CPU vs target (ZGCIntensity=5)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="376.2">CPU above target</tspan><tspan x="75.0" y="393.7">-&gt; expand heap at end of next GC cycle (smoothed)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="615.0" y="376.2">CPU below target</tspan><tspan x="615.0" y="393.7">-&gt; contract heap (smoothed)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="335.0" y="496.2">Good neighbor: host memory/CPU share</tspan><tspan x="335.0" y="513.7">(takes priority over target)</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="120.0" y="39.2">How a competent agent masks infrastructure faults</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="137.2">Injected fault</tspan><tspan x="70.0" y="154.7">(25% flaky API / lagging replica)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="350.0" y="137.2">Agent retry &amp;</tspan><tspan x="350.0" y="154.7">workaround logic</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="650.0" y="137.2">Task completion</tspan><tspan x="650.0" y="154.7">stays 19/19 (green)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="350.0" y="297.2">Hidden signals:</tspan><tspan x="350.0" y="314.7">tool calls +70% | retries</tspan><tspan x="350.0" y="332.2">uncertainty in prose summary</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="391.2">Detectors that caught faults: tool-call volume (+-7% envelope) &amp; scope drift (&gt;0.135) caught 4/7 each;</tspan><tspan x="60.0" y="408.7">task success caught only 2/7; token cost noisy (18% baseline variance) caught 1/7.</tspan></text>

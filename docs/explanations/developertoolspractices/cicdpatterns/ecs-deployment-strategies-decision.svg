<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="39.2">ECS deployment strategy: pick by rollback speed vs cost</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="111.2">Everyday change,</tspan><tspan x="72.0" y="128.7">cost-sensitive?</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="221.2">ROLLING</tspan><tspan x="72.0" y="238.7">+ circuit breaker + alarms</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="342.0" y="111.2">Bad release expensive?</tspan><tspan x="342.0" y="128.7">Need instant rollback?</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="342.0" y="219.2">BLUE/GREEN</tspan><tspan x="342.0" y="236.7">old rev warm 24h bake;</tspan><tspan x="342.0" y="254.2">rollback = traffic shift</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="632.0" y="111.2">Need gradual traffic</tspan><tspan x="632.0" y="128.7">steps?</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="632.0" y="219.2">LINEAR (equal steps)</tspan><tspan x="632.0" y="236.7">CANARY (2-step shift)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="339.2">Guardrails on ALL strategies:</tspan><tspan x="72.0" y="356.7">circuit breaker, CloudWatch alarms, StopServiceDeployment,</tspan><tspan x="72.0" y="374.2">lifecycle hooks (Lambda / pause -&gt; ContinueServiceDeployment)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="552.0" y="339.2">No ALB/Service Connect/VPC Lattice?</tspan><tspan x="552.0" y="356.7">Lambda hook at traffic-shift stage:</tspan><tspan x="552.0" y="374.2">you own the traffic shifting</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#495057" text-anchor="start"><tspan x="60.0" y="421.2">Rolling rollback = full redeploy (bad version keeps serving). Blue/green doubles capacity during window.</tspan></text>
</svg>
<rect x="40.0" y="90.0" width="180.0" height="90.0" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="270.0" y="90.0" width="180.0" height="90.0" rx="8" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="500.0" y="90.0" width="180.0" height="90.0" rx="8" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="1.5"/>

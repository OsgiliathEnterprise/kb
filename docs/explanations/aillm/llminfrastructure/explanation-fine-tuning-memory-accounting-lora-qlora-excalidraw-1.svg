<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 590.0 135.0 L 660.0 135.0"/><line x1="660.0" y1="135.0" x2="647.4" y2="128.9"/><line x1="660.0" y1="135.0" x2="647.4" y2="141.1"/></g>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="155.0" y="104.8">Full fine-tuning</tspan><tspan x="155.0" y="121.0">pays all 16 bytes/param:</tspan><tspan x="155.0" y="137.3">2 fp16 weights +</tspan><tspan x="155.0" y="153.5">2 fp16 grads +</tspan><tspan x="155.0" y="169.8">12 optimizer (K)</tspan><tspan x="155.0" y="186.0">7B → ~112 GB</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="465.0" y="104.8">LoRA</tspan><tspan x="465.0" y="121.0">base frozen at fp16 (14 GB)</tspan><tspan x="465.0" y="137.3">no grads/optimizer on base</tspan><tspan x="465.0" y="153.5">train ~4M adapter params</tspan><tspan x="465.0" y="169.8">(rank 8, q+v, 32 layers)</tspan><tspan x="465.0" y="186.0">≈0.06% of model</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="785.0" y="96.7">QLoRA</tspan><tspan x="785.0" y="112.9">base in 4-bit (~3.5 GB)</tspan><tspan x="785.0" y="129.2">+ double quantization</tspan><tspan x="785.0" y="145.4">(0.127 bits/param overhead)</tspan><tspan x="785.0" y="161.7">adapters at higher precision</tspan><tspan x="785.0" y="177.9">65B on one 48GB GPU;</tspan><tspan x="785.0" y="194.2">cost: dequantize = slower</tspan></text>
</svg>
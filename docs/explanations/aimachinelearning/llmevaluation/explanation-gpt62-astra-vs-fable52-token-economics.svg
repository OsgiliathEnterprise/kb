<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="22" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="37.6">Same price per token, 5x different bill: GPT-6.2 Astra vs Claude Fable 5.2 (The New Stack, Nov 2026)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="119.2">Claude Fable 5.2</tspan><tspan x="55.0" y="136.7"> </tspan><tspan x="55.0" y="154.2">Score: 357/359 (perfect x2, 110/110 coding)</tspan><tspan x="55.0" y="171.7">1,754,862 in / 103,602 out tokens</tspan><tspan x="55.0" y="189.2">19,442 reasoning tokens on one test</tspan><tspan x="55.0" y="206.7">Cost: $7.60   Time: 917 s</tspan><tspan x="55.0" y="224.2"> </tspan><tspan x="55.0" y="241.7">Heavy reasoner: practice scripts,</tspan><tspan x="55.0" y="259.2">3 revisions of the final script</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="545.0" y="119.2">GPT-6.2 Astra</tspan><tspan x="545.0" y="136.7"> </tspan><tspan x="545.0" y="154.2">Score: 355/359 (missed 1 billing rule)</tspan><tspan x="545.0" y="171.7">487,848 in / 13,219 out tokens</tspan><tspan x="545.0" y="189.2">830 reasoning tokens on one test</tspan><tspan x="545.0" y="206.7">Cost: $1.45   Time: 232 s</tspan><tspan x="545.0" y="224.2"> </tspan><tspan x="545.0" y="241.7">Lean: reads files, writes one script,</tspan><tspan x="545.0" y="259.2">done in a minute for $0.31</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="379.2">Both at $8/M input, $40/M output after the Nov 17 price cut.</tspan><tspan x="55.0" y="396.7">Recommended pattern: run Astra 2-3x on the same task, compare outputs;</tspan><tspan x="55.0" y="414.2">on disagreement add a verifier model (e.g. Fable 5.2); then tune prompts toward Astra.</tspan><tspan x="55.0" y="431.7">Exception: correctness-critical billing code — the 2-point gap justified 6x cost.</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1971c2" text-anchor="start"><tspan x="40.0" y="34.4">Asterisk call recording: record local -&gt; compress -&gt; encrypt -&gt; ship -&gt; index</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="54.0" y="118.4">Call + MixMonitor</tspan><tspan x="54.0" y="134.7">b option, UNIQUEID</tspan><tspan x="54.0" y="150.9">.wav to local spool</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="294.0" y="118.4">rec-post.sh</tspan><tspan x="294.0" y="134.7">ffmpeg -&gt; Opus 16k</tspan><tspan x="294.0" y="150.9">age -r recipient.pub</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="534.0" y="118.4">aws s3 cp</tspan><tspan x="534.0" y="134.7">s3://callrec-prod</tspan><tspan x="534.0" y="150.9">recordings/YYYY/MM/DD</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="774.0" y="118.4">MySQL index</tspan><tspan x="774.0" y="134.7">uniqueid -&gt;</tspan><tspan x="774.0" y="150.9">object_key</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="774.0" y="258.4">S3 lifecycle rule</tspan><tspan x="774.0" y="274.6">delete after N days</tspan><tspan x="774.0" y="290.9">Object Lock = legal hold</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="534.0" y="258.4">Playback service</tspan><tspan x="534.0" y="274.6">role check + audit</tspan><tspan x="534.0" y="290.9">decrypt -&gt; signed URL</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="294.0" y="258.4">Retry cron (10 min)</tspan><tspan x="294.0" y="274.6">old .wav in spool</tspan><tspan x="294.0" y="290.9">=&gt; alert</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#495057" text-anchor="start"><tspan x="40.0" y="360.4">Private age key lives ONLY on the playback service; PBX holds public recipient only.</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#495057" text-anchor="start"><tspan x="40.0" y="385.4">Delete local WAV only after upload AND DB insert succeed (set -e leaves file for retry).</tspan></text>

<rect x="40.0" y="90.0" width="170.0" height="70.0" rx="8" fill="#d0bfff" stroke="#7048e8" stroke-width="1.5"/>
<rect x="280.0" y="90.0" width="200.0" height="70.0" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
<rect x="550.0" y="90.0" width="200.0" height="70.0" rx="8" fill="#b2f2bb" stroke="#1971c2" stroke-width="1.5"/>
<rect x="820.0" y="90.0" width="220.0" height="70.0" rx="8" fill="#ffe8cc" stroke="#1971c2" stroke-width="1.5"/>
<rect x="40.0" y="230.0" width="480.0" height="140.0" rx="8" fill="#fff3bf" stroke="#1971c2" stroke-width="1.5"/>
<rect x="560.0" y="230.0" width="480.0" height="140.0" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/>
<g stroke="#1971c2" stroke-width="1.5" fill="none"><path d="M 210.0 125.0 L 280.0 125.0"/><line x1="280.0" y1="125.0" x2="267.4" y2="118.9"/><line x1="280.0" y1="125.0" x2="267.4" y2="131.1"/></g>
<g stroke="#1971c2" stroke-width="1.5" fill="none"><path d="M 480.0 125.0 L 550.0 125.0"/><line x1="550.0" y1="125.0" x2="537.4" y2="118.9"/><line x1="550.0" y1="125.0" x2="537.4" y2="131.1"/></g>
<g stroke="#1971c2" stroke-width="1.5" fill="none"><path d="M 750.0 125.0 L 820.0 125.0"/><line x1="820.0" y1="125.0" x2="807.4" y2="118.9"/><line x1="820.0" y1="125.0" x2="807.4" y2="131.1"/></g>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="36.0">Unit of recovery: cron admits per-recipient jobs; the worker owns retry + dedupe</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="110.4">Cron (09:00)</tspan><tspan x="50.0" y="126.7">enumerate 18,400</tspan><tspan x="50.0" y="142.9">recipients, ENQUEUE</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="290.0" y="110.4">Queue: one message per</tspan><tspan x="290.0" y="126.7">(report_date + tenant/recipient)</tspan><tspan x="290.0" y="142.9">light payload, &lt;=256KB body</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="560.0" y="110.4">Worker pool</tspan><tspan x="560.0" y="126.7">fetch report, send,</tspan><tspan x="560.0" y="142.9">ACK only on success</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="830.0" y="110.4">Provider 429s? Exponential</tspan><tspan x="830.0" y="126.7">backoff via delayed delivery</tspan><tspan x="830.0" y="142.9">(max 7 days), dedupe check first</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="251.2">Invariant (the page-sleeping test):</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#495057" text-anchor="start"><tspan x="50.0" y="277.6">- cron does minimum sync work then exits (900s max run)</tspan><tspan x="50.0" y="292.6">- at-least-once delivery =&gt; consumer MUST check durable</tspan><tspan x="50.0" y="307.6">  dedupe record (report_date+tenant) BEFORE sending</tspan><tspan x="50.0" y="322.6">- crash between provider-accept and ACK -&gt; redelivery must</tspan><tspan x="50.0" y="337.6">  NOT produce a second send</tspan><tspan x="50.0" y="352.6">- pause/resume does NOT backfill missed triggers: catch-up</tspan><tspan x="50.0" y="367.6">  is an explicit app decision</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="570.0" y="251.2">Monolithic cron failure domain:</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#495057" text-anchor="start"><tspan x="570.0" y="277.6">one process owns enumerate+render+send+retry state -&gt;</tspan><tspan x="570.0" y="292.6">mid-run 429 storm leaves 3 ugly choices:</tspan><tspan x="570.0" y="307.6">- rerun whole batch (duplicates)</tspan><tspan x="570.0" y="322.6">- hand-inspect partial state</tspan><tspan x="570.0" y="337.6">- build recovery path during the page</tspan><tspan x="570.0" y="352.6">Dashboard stays GREEN because the trigger</tspan><tspan x="570.0" y="367.6">was never the endangered unit.</tspan></text>
</svg>
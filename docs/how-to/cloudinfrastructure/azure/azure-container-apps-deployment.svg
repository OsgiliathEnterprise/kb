<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="380.0" y="32.8">Azure Container Apps: Identity-Based Deploy + KEDA Scaling + Revision Rollback</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="162.5" y="132.1">ACR (admin-enabled false)</tspan><tspan x="162.5" y="147.1">managed identity -&gt; AcrPull role</tspan><tspan x="162.5" y="162.1">scoped to one registry, no password</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="447.5" y="124.6">az containerapp create</tspan><tspan x="447.5" y="139.6">--registry-identity system</tspan><tspan x="447.5" y="154.6">--ingress external --target-port 8080</tspan><tspan x="447.5" y="169.6">min/max replicas + cpu/memory</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="732.5" y="124.6">KEDA scale rules</tspan><tspan x="732.5" y="139.6">HTTP: concurrent requests (50)</tspan><tspan x="732.5" y="154.6">queue: azure-queue queueLength=5</tspan><tspan x="732.5" y="169.6">--min-replicas 0 -&gt; idle costs nothing</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="1017.5" y="132.1">Pipelines: buildAndPush tag=$(Build.BuildId)</tspan><tspan x="1017.5" y="147.1">never latest -&gt; traceable to run</tspan><tspan x="1017.5" y="162.1">az containerapp update --image ...:$(Build.BuildId)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="1302.5" y="132.1">Revisions (Multiple mode)</tspan><tspan x="1302.5" y="147.1">rollback = traffic-weight change, no redeploy</tspan><tspan x="1302.5" y="162.1">ingress traffic set revision-weight prev=100 broken=0</tspan></text>
</svg>
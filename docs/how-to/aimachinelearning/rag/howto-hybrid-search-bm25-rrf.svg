<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="39.2">Hybrid retrieval: BM25 + vectors merged with reciprocal rank fusion</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="150.8">Query -&gt; BM25 keyword search</tspan><tspan x="70.0" y="170.8">(exact tokens: INV-20931,</tspan><tspan x="70.0" y="190.8">ECONNRESET, names)</tspan><tspan x="70.0" y="210.8">top 20-50</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="350.0" y="150.8">Query -&gt; vector embedding</tspan><tspan x="350.0" y="170.8">search (paraphrases,</tspan><tspan x="350.0" y="190.8">semantics) top 20-50</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="630.0" y="150.8">RRF merge: score(doc) =</tspan><tspan x="630.0" y="170.8">sum over lists 1/(k+rank),</tspan><tspan x="630.0" y="190.8">k=60, no normalisation</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="910.0" y="150.8">Keep top 5-10 for the prompt;</tspan><tspan x="910.0" y="170.8">optional reranker after fusion</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="1190.0" y="150.8">Evaluate: recall@k + MRR</tspan><tspan x="1190.0" y="170.8">split by query type</tspan><tspan x="1190.0" y="190.8">(ID vs paraphrase)</tspan></text>

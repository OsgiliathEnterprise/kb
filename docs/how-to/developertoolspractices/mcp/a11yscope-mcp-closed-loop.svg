<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="27.8">a11yscope-mcp — accessibility feedback loop for coding agents</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="77.6">Coding agent</tspan><tspan x="50.0" y="92.6">(Claude Code / Cursor)</tspan><tspan x="50.0" y="107.6">claude mcp add a11yscope</tspan><tspan x="50.0" y="122.6">-- npx -y a11yscope-mcp</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="390.0" y="77.6">a11yscope-mcp tools</tspan><tspan x="390.0" y="92.6">scan_page (URL/file → headless Chrome)</tspan><tspan x="390.0" y="107.6">scan_html (markup string)</tspan><tspan x="390.0" y="122.6">list_rules (31 WCAG 2.2 checks)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="740.0" y="77.6">headless Chrome/Chromium/Edge</tspan><tspan x="740.0" y="92.6">runs fully locally</tspan><tspan x="740.0" y="107.6">zero downloads, zero egress</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="390.0" y="237.6">findings per rule</tspan><tspan x="390.0" y="252.6">CSS selector + HTML snippet</tspan><tspan x="390.0" y="267.6">+ fix message</tspan><tspan x="390.0" y="282.6">violations / review buckets</tspan><tspan x="390.0" y="297.6">+ conformance disclaimer</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="11" fill="#e8590c" text-anchor="start"><tspan x="300.0" y="178.8">agent edits file → re-scan</tspan><tspan x="300.0" y="192.6">until violations empty</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="237.6">then audit: element counts</tspan><tspan x="50.0" y="252.6">per rule before/after</tspan><tspan x="50.0" y="267.6">(deletion loophole)</tspan><tspan x="50.0" y="282.6">flag stock alt text as review</tspan></text>

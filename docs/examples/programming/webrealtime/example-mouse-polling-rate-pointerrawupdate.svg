<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="36.0">Browser mouse polling-rate measurement: raw reports -&gt; counting window -&gt; throttled UI</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="123.2">Mouse</tspan><tspan x="75.0" y="140.7">(125–8000 Hz)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="335.0" y="108.4">pointerrawupdate</tspan><tspan x="335.0" y="124.7">(Chrome/Edge, HTTPS)</tspan><tspan x="335.0" y="140.9">or pointermove +</tspan><tspan x="335.0" y="157.2">getCoalescedEvents()</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="635.0" y="110.4">report(t): push event</tspan><tspan x="635.0" y="126.7">.timeStamp into sliding</tspan><tspan x="635.0" y="142.9">500 ms window (reset</tspan><tspan x="635.0" y="159.2">after 60 ms pause)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="635.0" y="235.4">rate() = (n-1)/span * 1000</tspan><tspan x="635.0" y="251.7">counting, NOT gap timing</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="335.0" y="230.4">snap() to nearest of</tspan><tspan x="335.0" y="246.7">[125..8000] within 10%</tspan><tspan x="335.0" y="262.9">keep peak (&gt;=20 reports)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="232.4">UI: rAF loop,</tspan><tspan x="75.0" y="248.7">DOM update max</tspan><tspan x="75.0" y="264.9">5x/s (200 ms)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="311.2">Why: pointermove bundles reports per frame (measures monitor, not mouse);</tspan><tspan x="60.0" y="328.7">Spectre timestamp rounding (~0.1 ms) kills gap-timing at 4-8 kHz; polling rate is a maximum</tspan><tspan x="60.0" y="346.2">(mouse reports only while moving) -&gt; count in window, require continuous movement.</tspan></text>
</svg>
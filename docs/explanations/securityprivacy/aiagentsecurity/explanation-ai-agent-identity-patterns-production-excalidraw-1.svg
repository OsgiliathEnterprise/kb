<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="80.0" y="49.2">Five Identity Patterns for Production AI Agents</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="149.2">5. Provenance chain across every hop (act claim, signed context headers)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="229.2">4. Per-tool authorization boundaries (MCP schemas, per-tool scoped credentials)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="309.2">3. Request-scoped short-lived credentials (Vault, projected tokens, STS)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="389.2">2. Scoped delegated authority (OAuth token exchange RFC 8693, DPoP)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="469.2">1. Own workload identity (SPIFFE/SPIRE, cloud workload federation)</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="465.0" y="93.7">Agent proposes command</tspan><tspan x="465.0" y="111.2">with secret inline:</tspan><tspan x="465.0" y="128.7">PGPASSWORD=... psql -h ...</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.0">robots.txt AI crawler control: who to block, who to allow</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="92.8">TRAINING bots (block?)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="400.0" y="92.8">AI SEARCH bots (usually allow)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="740.0" y="92.8">CONTROL tokens (no UA!)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="135.2">GPTBot (OpenAI)</tspan><tspan x="72.0" y="152.7">ClaudeBot (Anthropic)</tspan><tspan x="72.0" y="170.2">CCBot (Common Crawl)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="195.2">Training crawlers collect pages</tspan><tspan x="72.0" y="212.7">for model training - the main</tspan><tspan x="72.0" y="230.2">opt-out target</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="412.0" y="135.2">OAI-SearchBot -&gt; ChatGPT</tspan><tspan x="412.0" y="152.7">search; PerplexityBot -&gt;</tspan><tspan x="412.0" y="170.2">Perplexity answers</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="412.0" y="195.2">ChatGPT-User: user-triggered</tspan><tspan x="412.0" y="212.7">fetch; may SKIP robots.txt</tspan><tspan x="412.0" y="230.2">by design (vendor docs)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="752.0" y="135.2">Google-Extended / Applebot-</tspan><tspan x="752.0" y="152.7">Extended never appear in</tspan><tspan x="752.0" y="170.2">logs - policy signals only</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="752.0" y="195.2">Blocking Google-Extended</tspan><tspan x="752.0" y="212.7">!= opt-out of Google Search</tspan><tspan x="752.0" y="230.2">/ AI Overviews</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="289.2">Decision: want AI traffic?  allow search bots + user fetchers, block only training bots.</tspan><tspan x="72.0" y="306.7">Premium content? block training bots, allow search on public pages, also Disallow: /members/ for AI bots.</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="389.2">After every change, TEST the live file (fetch https://your.site/robots.txt; check per-path decisions)</tspan><tspan x="72.0" y="406.7">and check CDN bot-fight settings - they can override robots.txt rules.</tspan></text>
</svg>
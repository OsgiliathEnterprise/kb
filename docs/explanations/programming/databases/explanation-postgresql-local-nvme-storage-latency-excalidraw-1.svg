<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="165.0" y="70.0">Five symptoms at scale</tspan><tspan x="165.0" y="87.5">slow ingestion, P95 spikes</tspan><tspan x="165.0" y="105.0">vacuum lag, checkpoint spikes</tspan><tspan x="165.0" y="122.5">replication lag</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="165.0" y="229.9">One shared budget</tspan><tspan x="165.0" y="247.4">storage bandwidth / IOPS</tspan><tspan x="165.0" y="264.9">/ queue capacity</tspan><tspan x="165.0" y="282.4">(client + maintenance I/O)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="530.0" y="70.0">Local NVMe</tspan><tspan x="530.0" y="87.5">16,030 TPS, 4.0 ms median</tspan><tspan x="530.0" y="105.0">I/O misses in tens of us</tspan><tspan x="530.0" y="122.5">CPU stays busy</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="530.0" y="229.9">gp3 EBS @ 3k IOPS</tspan><tspan x="530.0" y="247.4">1,734 TPS, 36.9 ms median</tspan><tspan x="530.0" y="264.9">19 ms page reads + 11 ms fsync</tspan><tspan x="530.0" y="282.4">CPU idle waiting on I/O</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="330.4">same queries, same cluster config - only the storage class changes</tspan></text>

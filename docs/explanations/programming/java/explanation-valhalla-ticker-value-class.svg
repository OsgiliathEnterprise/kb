<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="191.2">&quot;ORCL&quot; -&gt; packed = 0x1A74E5C0   |   ALPHABET &quot;.0123456789A-Z&quot; -&gt; codes 1..37 (0 reserved for padding)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="226.2">compareTo() = Integer.compare(packed, other.packed)  -&gt;  integer order == string order (no decode needed)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="155.0" y="296.2">C2 scalarization (hot code):</tspan><tspan x="155.0" y="313.7">the int flows through locals/args/returns,</tspan><tspan x="155.0" y="331.2">no separate heap object</tspan></text>

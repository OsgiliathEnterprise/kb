<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="320.0" y="59.2">Java Immutable Data: Feature Stack (JavaOne 2026)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="126.2">Records + record patterns (JDK 14/16)</tspan><tspan x="75.0" y="143.7">- canonical immutable classes</tspan><tspan x="75.0" y="161.2">- destructure via case Point(int x, int y)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="226.2">Value classes / value objects (JEP 401, Valhalla)</tspan><tspan x="75.0" y="243.7">- inlined data, no reference indirection</tspan><tspan x="75.0" y="261.2">- early field initialization ONLY, no reflective mutation</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="326.2">Amber: derived record creation, deconstructors,</tspan><tspan x="75.0" y="343.7">flexible constructor bodies, lazy constants API,</tspan><tspan x="75.0" y="361.2">static final init diagnostics</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="426.2">JVM-level (JDK 28 target):</tspan><tspan x="75.0" y="443.7">JEP 401 Value Objects (Preview)</tspan><tspan x="75.0" y="461.2">JEP 539 Strict Field Initialization (Preview)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="575.0" y="126.2">Safety hardening:</tspan><tspan x="575.0" y="143.7">- reflective final-field mutation -&gt; IllegalAccessError</tspan><tspan x="575.0" y="161.2">- gradual: warnings first, then errors (legacy flag)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="575.0" y="226.2">Serialization overhaul:</tspan><tspan x="575.0" y="243.7">- constructor-based protocol (deserialize fields -&gt;</tspan><tspan x="575.0" y="261.2">  invoke constructor -&gt; publish), marshalling API replaces</tspan><tspan x="575.0" y="278.7">  java.io.Serializable</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="575.0" y="326.2">Final arrays (planned):</tspan><tspan x="575.0" y="343.7">- final on array creation expressions</tspan><tspan x="575.0" y="361.2">- declarative contents (copy / fill / lambda-derived)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="522.8">Best practices: prefer value record classes -&gt; deconstructors as fallback -&gt; abstract records for pattern switches</tspan><tspan x="60.0" y="542.8">-&gt; finalize fields during construction -&gt; lazy constants over hand-rolled lazy statics -&gt; final arrays with declarative creation</tspan></text>
</svg>
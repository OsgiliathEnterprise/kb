<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="765.0" y="269.6">escalate: R05/R10/R29 (disputes, revoked auth) -&gt; compliance / human</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="106.2">HW VP9 encoder\naccepts L3T3 config\nreports all layers OK\n(emits 720p only)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="315.0" y="106.2">SFU expects 3 layers\n(720p + 360p + 180p)\nwaits for 2 that\nnever arrive</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="595.0" y="106.2">Quality scoring\ndegrades for all\nsubscribers\n+ phantom 71kbps target</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="315.0" y="276.2">Mitigations: (a) libvpx software VP9 emits all 3 layers (CPU/battery cost);\n(b) broadcast mode — publisher sends one HW stream at top resolution, SFU\ntranscodes the quality ladder server-side (opt-in, for broadcast use cases)</tspan></text>

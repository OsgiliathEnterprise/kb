<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="39.2">Idempotent webhook handler: claim, work, release, take over stale</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="147.8">Delivery arrives (providers</tspan><tspan x="70.0" y="167.8">retry at-least-once, hours)</tspan><tspan x="70.0" y="187.8">-&gt; verify signature FIRST</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="356.0" y="147.8">ATOMIC claim: INSERT event_id</tspan><tspan x="356.0" y="167.8">PK ON CONFLICT DO UPDATE</tspan><tspan x="356.0" y="187.8">WHERE stale processing &gt;5min</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="642.0" y="147.8">Not claimed: already done or</tspan><tspan x="642.0" y="167.8">another worker holds it -&gt; 200</tspan><tspan x="642.0" y="187.8">(acknowledge, stop retries)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="928.0" y="147.8">Claimed: run side effect.</tspan><tspan x="928.0" y="167.8">Success -&gt; status done, 200</tspan><tspan x="928.0" y="187.8">Failure -&gt; DELETE claim, 500</tspan><tspan x="928.0" y="207.8">(provider retry runs it)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="1214.0" y="147.8">Crash gap remains -&gt; make side</tspan><tspan x="1214.0" y="167.8">effect idempotent: Idempotency-Key,</tspan><tspan x="1214.0" y="187.8">same-transaction write, or</tspan><tspan x="1214.0" y="207.8">safe-to-repeat verb</tspan></text>
</svg>
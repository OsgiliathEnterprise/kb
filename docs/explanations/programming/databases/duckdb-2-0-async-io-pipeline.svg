<rect x="40.0" y="60.0" width="330.0" height="110.0" rx="8" fill="#ced4da" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="430.0" y="60.0" width="330.0" height="110.0" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="40.0" y="210.0" width="720.0" height="70.0" rx="8" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.5"/>

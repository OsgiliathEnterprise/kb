<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">Jev inside a Spring AI pipeline — decision layer in front of the LLM</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="107.8">state + typed questions</tspan><tspan x="52.0" y="127.8">(noul / choice / score)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="272.0" y="107.8">Jev /v1/systemone</tspan><tspan x="272.0" y="127.8">~70-500ms, parallel</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="492.0" y="107.8">JevPromptGuardAdvisor</tspan><tspan x="492.0" y="127.8">block &gt;= 0.8 / review &gt;= 0.5</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="712.0" y="107.8">ChatClient + LLM</tspan><tspan x="712.0" y="127.8">(generates the reply)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="192.8">Jev decides (route / score / guard) with calibrated probabilities; the LLM generates.</tspan><tspan x="40.0" y="212.8">Confidence = distribution shape -&gt; escalation threshold in config. Never reuse thresholds across noul/choice/score.</tspan></text>

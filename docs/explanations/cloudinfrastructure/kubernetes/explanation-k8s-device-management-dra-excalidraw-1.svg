<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="36.0">DRA: four stages (GA in Kubernetes 1.34)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="116.2">MODELING</tspan><tspan x="50.0" y="133.7">vendor driver</tspan><tspan x="50.0" y="151.2">ResourceSlice</tspan><tspan x="50.0" y="168.7">(capacity, attributes)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="280.0" y="116.2">REQUESTING</tspan><tspan x="280.0" y="133.7">user</tspan><tspan x="280.0" y="151.2">ResourceClaim +</tspan><tspan x="280.0" y="168.7">DeviceClass (CEL)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="510.0" y="116.2">SCHEDULING</tspan><tspan x="510.0" y="133.7">kube-scheduler</tspan><tspan x="510.0" y="151.2">match slices</tspan><tspan x="510.0" y="168.7">(first-fit, NP-hard)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#2f9e44" text-anchor="start"><tspan x="740.0" y="116.2">ACTUATION</tspan><tspan x="740.0" y="133.7">on-node DRA driver</tspan><tspan x="740.0" y="151.2">prepare + secure</tspan><tspan x="740.0" y="168.7">device for Pod</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="226.2">Sharing: (1) user-mediated - one claim shared across containers</tspan><tspan x="40.0" y="243.7">(2) overlapping partitions - MIG, scheduler invalidates overlaps</tspan><tspan x="40.0" y="261.2">(3) consumable capacity - per-claim amounts of a shared device (e.g. 2Gbps of a 40Gbps NIC)</tspan></text>
</svg>
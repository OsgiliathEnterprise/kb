<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="108.2">MCP client\n(token scope: user:read,\nworkers:read)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="335.0" y="108.2">403 insufficient_scope\nWWW-Authenticate:\nscope=baseline+missing</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="615.0" y="108.2">Client unions scopes\n(current ∪ challenge)\nre-auth via code flow</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="335.0" y="268.2">Retry original call\nwith union-scoped token\n→ 200</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="245.0" y="96.2">tool call</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="366.2">Google incremental auth instead: app notices the gap itself (no WWW-Authenticate),\nre-authenticates with include_granted_scopes=true, the AUTHORIZATION SERVER carries\nold scopes forward. MCP 2026-07-28: client computes the union — a stateless\nserver cannot do it (issue #2349).</tspan></text>

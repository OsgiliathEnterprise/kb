<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="34.4">gpu-unlock: FP/BF16 rate unlock on RTX 3000 series (GA10x)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="270.0" y="124.6">Kernel boot (initramfs)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="270.0" y="207.1">gpu_unlock kmod loads BEFORE nvidia binds</tspan><tspan x="270.0" y="222.1">clears firmware-left bus mastering first</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="270.0" y="289.6">Writes speed selectors: SS0 = 0x88888888</tspan><tspan x="270.0" y="304.6">(full BF16 rate) + SS1 = 0x8 (IMLA4)</tspan><tspan x="270.0" y="319.6">(V67/PLM technique, pre-driver timing)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="270.0" y="394.6">FLR (function-level reset)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="270.0" y="477.1">nvidia driver binds normally</tspan><tspan x="270.0" y="492.1">(unmodified driver, no per-release patching)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="270.0" y="567.1">FP/BF16 FMA issue rate doubled</tspan><tspan x="270.0" y="582.1">GEMM: FP16 87-&gt;118, BF16 87-&gt;157, TF32 42-&gt;82 TFLOPS (3090 Ti)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="770.0" y="114.6">Opt-in via kernel command line:</tspan><tspan x="770.0" y="129.6">  gpu_unlock.targets=all</tspan><tspan x="770.0" y="144.6">  gpu_unlock.targets=0000:21:00.0[,00:22:00.0]</tspan><tspan x="770.0" y="159.6">(all = every unbound GA102/GA103/GA104/GA106;</tspan><tspan x="770.0" y="174.6">addresses as lspci -D prints them)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="770.0" y="252.1">Suspend to RAM powers cards off and resets the selectors;</tspan><tspan x="770.0" y="267.1">module re-unlocks on resume ~1 s before nvidia resumes.</tspan><tspan x="770.0" y="282.1">Disable: gpu_unlock.resume=0.</tspan><tspan x="770.0" y="297.1">Hibernation is not covered.</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="770.0" y="369.6">Verify:</tspan><tspan x="770.0" y="384.6">  journalctl -k -b | grep gpu_unlock</tspan><tspan x="770.0" y="399.6">  lspci -nnk -s 0000:21:00.0</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="560.0" y="439.6">Manual load after nvidia bound does nothing; display card works too (screen blank until nvidia-drm takes over).</tspan></text>
</svg>
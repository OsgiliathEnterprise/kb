<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="36.0">At-least-once job consumer: exactly-once business effect</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="80.0" y="110.4">Broker redelivers</tspan><tspan x="80.0" y="126.7">(after worker crash</tspan><tspan x="80.0" y="142.9">pre-ack)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="345.0" y="102.4">Derive BUSINESS key</tspan><tspan x="345.0" y="118.7">digest:customer-1842:2026-W32</tspan><tspan x="345.0" y="134.9">+ payload hash</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="645.0" y="102.4">DB TX: INSERT key UNIQUE</tspan><tspan x="645.0" y="118.7">+ outbox record + accepted</tspan><tspan x="645.0" y="134.9">(ack ONLY after commit)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="575.0" y="235.4">Unique-constraint hit?</tspan><tspan x="575.0" y="251.7">-&gt; duplicate: read existing decision,</tspan><tspan x="575.0" y="267.9">record attempt, ack, NO second send</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="235.4">Outbox worker: call provider with SAME idempotency</tspan><tspan x="75.0" y="251.7">key; record response; 429 -&gt; Retry-After/backoff+jitter;</tspan><tspan x="75.0" y="267.9">permanent fail -&gt; DLQ (preserve key on redrive)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="352.4">Invariant: one customer-period = ONE accepted decision.  Alert separately on duplicate deliveries (normal) vs second sends (correctness incident).  Reconcile: producer cmd x idempotency record x domain data x provider result.</tspan></text>

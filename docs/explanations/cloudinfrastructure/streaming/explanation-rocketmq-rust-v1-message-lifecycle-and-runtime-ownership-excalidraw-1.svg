<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="155.0" y="115.4">Producer\nget topic route from NameServer\nselect writable queue\nsend request (deadline)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="480.0" y="115.4">Broker\nvalidate request (role, perms, config)\nappend to CommitLog\nreturn outcome → producer response</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="830.0" y="115.4">Derived structures (async)\nConsumeQueue: queue position → physical record\nkey indexes for lookup\ncatch up at their own rate</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="830.0" y="305.4">Consumer\ndiscover queues → fetch → process\ncommit progress (model-dependent)\ncrash before commit ⇒ redelivery ⇒ duplicates</tspan></text>

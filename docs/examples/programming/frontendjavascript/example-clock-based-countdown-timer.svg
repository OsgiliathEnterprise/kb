<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="92.0" y="237.6">Each tick late + hidden-tab throttling</tspan><tspan x="92.0" y="252.6">-&gt; timer says 12:00 when it should be over</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="462.0" y="237.6">remaining = endTime - Date.now()</tspan><tspan x="462.0" y="252.6">redraw timing irrelevant -&gt; always correct</tspan></text>

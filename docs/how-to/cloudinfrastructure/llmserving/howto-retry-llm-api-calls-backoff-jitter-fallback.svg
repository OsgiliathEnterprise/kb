<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="39.2">LLM API retry ladder: classify -&gt; backoff with full jitter -&gt; budget -&gt; fallback</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="120.8">Call fails: status in {408,429,500,502,503,504,529}</tspan><tspan x="70.0" y="140.8">or timeout/ECONNRESET?  400/401/403 -&gt; NEVER retry</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="230.8">Sleep = max(Retry-After, random()*min(maxMs, base*2^n))</tspan><tspan x="70.0" y="250.8">full jitter; provider's Retry-After wins when longer</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="340.8">Total waited &gt; budgetMs? -&gt; stop early,</tspan><tspan x="70.0" y="360.8">fail fast or fall back; do not hang the user</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="450.8">Fall back to next tested model;</tspan><tspan x="70.0" y="470.8">log which model answered (cost + routing)</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">CAD -&gt; glTF asset pipeline (per product variant)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="115.0" y="94.6">1. Decimate + merge</tspan><tspan x="115.0" y="109.6">(Blender)</tspan><tspan x="115.0" y="124.6">4000 parts -&gt; a few meshes</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="295.0" y="94.6">2. Orient + scale</tspan><tspan x="295.0" y="109.6">Z-up -&gt; Y-up</tspan><tspan x="295.0" y="124.6">1 unit = 1 meter, bake it</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="475.0" y="94.6">3. PBR by slot</tspan><tspan x="475.0" y="109.6">(frame, glass, hardware)</tspan><tspan x="475.0" y="124.6">not per part</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="655.0" y="94.6">4. Compress</tspan><tspan x="655.0" y="109.6">Draco geometry</tspan><tspan x="655.0" y="124.6">KTX2 textures</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="182.8">90 MB in -&gt; 2-5 MB out, no visible loss on a product shot.</tspan><tspan x="40.0" y="202.8">gltf-transform optimize in.glb out.glb --compress draco --texture-compress ktx2</tspan></text>
</svg>
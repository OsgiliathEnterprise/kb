<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="11" fill="#1e1e1e" text-anchor="middle"><tspan x="760.0" y="72.8">results[]: rerank_score(0-3), snippet (UI), summary (model), content, authority(0-4)</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="400.0" y="29.6">K8s control plane: three failure modes -&gt; four seams</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="165.0" y="124.6">NODE-BOUND</tspan><tspan x="165.0" y="139.6">100k nodes x 10s heartbeats</tspan><tspan x="165.0" y="154.6">~10k writes/s, ~70% lease QPS</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="475.0" y="124.6">CHURN-BOUND</tspan><tspan x="475.0" y="139.6">agent platforms: sessions</tspan><tspan x="475.0" y="154.6">tousands of writes/min (CRDs)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="785.0" y="124.6">STATE-BOUND</tspan><tspan x="785.0" y="139.6">heavy object state</tspan><tspan x="785.0" y="154.6">resident bytes x every apiserver</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="165.0" y="349.6">Seam 1: storage contract</tspan><tspan x="165.0" y="364.6">KEP-4743 / -etcd-servers-overrides</tspan><tspan x="165.0" y="379.6">ephemeral writes -&gt; separate store</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="475.0" y="349.6">Seam 2: node liveness contract</tspan><tspan x="475.0" y="364.6">node-facing tier + etcd</tspan><tspan x="475.0" y="379.6">in-memory lease refresh</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="785.0" y="349.6">Seam 3: shard axis</tspan><tspan x="785.0" y="364.6">KEP-5866 hash-range filtering</tspan><tspan x="785.0" y="379.6">(relieves all three)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="1095.0" y="349.6">Seam 4: cache residency</tspan><tspan x="1095.0" y="364.6">2-shard prototype halves heap</tspan><tspan x="1095.0" y="379.6">~0.9 KB floor per RBAC object</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="400.0" y="449.6">recipe ladder: Classic HA (&lt;=5k) -&gt; Role-Split (5-20k) -&gt; Node Plane (20-65k) -&gt; Partitioned Store (~100k) -&gt; Sharded Slice (beyond, unbuilt)</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="265.0" y="202.0">Berth A vacant [S2, S4)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="600.0" y="262.0">Berth B [S4, S6)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="95.0" y="286.2">board S1 -&gt; berth A</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="595.0" y="286.2">hop S4 -&gt; berth B</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="750.0" y="342.0">arrive S6</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="393.6">Rules: occupied wins | unknown never vacant | no branch cutoff | keep top-k per station (&lt;=5 paths, &lt;=8 steps)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="433.6">Complexity ~ stations x ranges x stations (&lt;100 halts, &lt;2000 berths -&gt; phone) + property test vs brute-force oracle</tspan></text>
</svg>
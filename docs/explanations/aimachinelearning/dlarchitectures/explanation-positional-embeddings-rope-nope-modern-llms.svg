<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="36.0">Where does position information enter an LLM? Three injection points</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="106.2">Token IDs</tspan><tspan x="75.0" y="123.7">(tokenizer)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="275.0" y="106.2">Token embedding</tspan><tspan x="275.0" y="123.7">layer</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="495.0" y="106.2">Transformer blocks</tspan><tspan x="495.0" y="123.7">(attention + FFN)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="745.0" y="106.2">Next-token</tspan><tspan x="745.0" y="123.7">logits</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="241.2">GPT-2: learned ABSOLUTE</tspan><tspan x="70.0" y="258.7">P_m added to embedding</tspan><tspan x="70.0" y="276.2">(before block 1)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#495057" text-anchor="start"><tspan x="70.0" y="304.6">P: max_seq_len x d table,</tspan><tspan x="70.0" y="319.6">learned per position</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="350.0" y="241.2">RoPE: ROTATE Q,K inside</tspan><tspan x="350.0" y="258.7">attention by m*theta_i</tspan><tspan x="350.0" y="276.2">(V bypasses rotation)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#495057" text-anchor="start"><tspan x="350.0" y="304.6">theta_i = b^(-2i/d); score</tspan><tspan x="350.0" y="319.6">depends only on offset m-n</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="630.0" y="241.2">Learned RELATIVE bias:</tspan><tspan x="630.0" y="258.7">add bias(hidden, m-n) to</tspan><tspan x="630.0" y="276.2">scores before softmax</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#495057" text-anchor="start"><tspan x="630.0" y="304.6">T5 (2019), Inkling (2026)</tspan><tspan x="630.0" y="319.6">sliding-window + global</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#868e96" text-anchor="start"><tspan x="60.0" y="380.4">NoPE: no explicit position at all - the causal mask alone leaks prefix length (SmolLM3 skips RoPE every 4th layer)</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="100.0" y="39.2">Berth = half-open segments; seat hopping = backwards shortest path</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="142.8">S1</tspan></text>

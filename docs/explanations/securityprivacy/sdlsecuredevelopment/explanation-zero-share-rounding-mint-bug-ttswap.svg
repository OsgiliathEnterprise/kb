<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="34.4">TTSwap investGood: zero-share dust bug and pre-mutation guard</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="162.2">invest tiny amount</tspan><tspan x="50.0" y="179.7">at high leverage</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="330.0" y="162.2">investShare =</tspan><tspan x="330.0" y="179.7">amount / sharePrice</tspan><tspan x="330.0" y="197.2">(rounds DOWN to 0)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="630.0" y="107.2">UNFIXED: tokens moved,</tspan><tspan x="630.0" y="124.7">state mutated,</tspan><tspan x="630.0" y="142.2">0 shares minted</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="630.0" y="247.2">FIX: before mutation</tspan><tspan x="630.0" y="264.7">if investShare==0:</tspan><tspan x="630.0" y="282.2"> revert TTSwapError(38)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#e03131" text-anchor="start"><tspan x="520.0" y="112.1">no guard</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#e03131" text-anchor="start"><tspan x="520.0" y="202.1">guard clause</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="367.2">Lesson: rounding is a security boundary - any amount/sharePrice that floors to 0 is an unpriced deposit.</tspan><tspan x="50.0" y="384.7">Check every mint path for 'succeeded but gave nothing'; revert BEFORE state mutation.</tspan></text>

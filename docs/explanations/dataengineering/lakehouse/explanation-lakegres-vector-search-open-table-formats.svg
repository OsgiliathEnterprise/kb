<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="39.2">Lakegres: vector search directly on open table formats (Hudi/Iceberg)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="150.8">Unstructured content +</tspan><tspan x="70.0" y="170.8">embeddings already in lake</tspan><tspan x="70.0" y="190.8">tables (Hudi / Iceberg)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="350.0" y="150.8">IVF index stored in table</tspan><tspan x="350.0" y="170.8">metadata, same bucket as data;</tspan><tspan x="350.0" y="190.8">centroids probed, nprobes tunable</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="630.0" y="150.8">Commits that insert/update/</tspan><tspan x="630.0" y="170.8">delete rows keep index</tspan><tspan x="630.0" y="190.8">consistent - no separate store</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="910.0" y="150.8">Query via Postgres wire</tspan><tspan x="910.0" y="170.8">protocol; Spark cluster</tspan><tspan x="910.0" y="190.8">(5 executors + driver)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="1190.0" y="150.8">247M vectors: p50 63.5ms vs</tspan><tspan x="1190.0" y="170.8">655ms (Databricks AI Search);</tspan><tspan x="1190.0" y="190.8">Recall@10 ~0.95 both</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="740.0" y="249.6">trigger CI / deploy</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="329.6">GitHub.com hosts no server hooks: substitute branch protection + required status checks (GH Actions).</tspan></text>

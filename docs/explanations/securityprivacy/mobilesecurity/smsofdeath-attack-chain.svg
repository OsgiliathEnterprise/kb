<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.0">SMS of Death - zero-click WAP Push DoS of com.android.phone</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="91.2">Remote data SMS</tspan><tspan x="40.0" y="108.7">(WAP Push, port 2948)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="191.2">WapPushOverSms.decodeWapPdu</tspan><tspan x="40.0" y="208.7">(frameworks/opt/telephony)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="291.2">unchecked long-&gt;int cast</tspan><tspan x="40.0" y="308.7">0x80000000 = -2147483648</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="391.2">NegativeArraySizeException</tspan><tspan x="40.0" y="408.7">on telephony main thread</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="491.2">com.android.phone crashes</tspan><tspan x="40.0" y="508.7">calls drop (incl. emergency)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="591.2">carrier redelivery</tspan><tspan x="40.0" y="608.7">re-triggers the crash</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="691.2">rapid delivery (~30 messages):</tspan><tspan x="40.0" y="708.7">SQLite SMS store corrupted</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="791.2">crash on every boot</tspan><tspan x="40.0" y="808.7">(persistent DoS)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="524.0" y="390.4">unacknowledged messages</tspan><tspan x="524.0" y="406.6">re-sent by carrier</tspan><tspan x="524.0" y="422.9">(up to 1 week in testing)</tspan></text>

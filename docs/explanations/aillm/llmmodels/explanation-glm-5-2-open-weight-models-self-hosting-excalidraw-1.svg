<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="240.0" y="42.8">From Hosted-Model Pull to Open-Weight Self-Hosting</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="136.4">Fable 5 / Mythos 5 pulled worldwide</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="136.4">June 12 (US export-control</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="136.4">directive, no grace period)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="296.4">GLM-5.2 ships same week</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="296.4">Z.ai: MIT-licensed open weights,</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="296.4">753B MoE, 1M-token context</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="462.4">Lesson: access is not ownership</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="462.4">enterprises on Fable lost their</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="462.4">engine in an afternoon</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="644.4">Self-hosting economics</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="644.4">~$20k local hardware (DGX Spark)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="644.4">pays back vs API bills in 6-7 mo</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="644.4">swap models via config, not rewrite</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="140.0" y="99.2">Warm-up (3 min)</tspan><tspan x="140.0" y="115.4">load ramps up</tspan><tspan x="140.0" y="131.7">startup growth allowed</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="420.0" y="91.0">Steady load (30 min)</tspan><tspan x="420.0" y="107.3">RATE=2 sessions/s</tspan><tspan x="420.0" y="123.5">~3600 agent sessions</tspan><tspan x="420.0" y="139.8">memory sampled /10s</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="700.0" y="91.0">Cool-down (5 min)</tspan><tspan x="700.0" y="107.3">no load</tspan><tspan x="700.0" y="123.5">memory must return</tspan><tspan x="700.0" y="139.8">to baseline</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="550.0" y="254.2">Leak verdict: steady growth during load (slope &gt; limit,</tspan><tspan x="550.0" y="270.4">good linear fit) OR no return to baseline in cool-down.</tspan><tspan x="550.0" y="286.6">'Memory went up' alone is NOT a leak.</tspan></text>

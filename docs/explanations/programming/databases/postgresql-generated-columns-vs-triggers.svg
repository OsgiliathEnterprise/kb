<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="27.8">PostgreSQL derived column: generated column or trigger?</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="250.0" y="97.6">Value derivable from same-row columns</tspan><tspan x="250.0" y="112.6">via immutable functions only?</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="11" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="226.8">GENERATED ALWAYS AS (...)</tspan><tspan x="50.0" y="240.6">DB computes it; nobody can write it</tspan><tspan x="50.0" y="254.3">visible in table definition</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="11" fill="#1e1e1e" text-anchor="start"><tspan x="470.0" y="226.8">Trigger-maintained column</tspan><tspan x="470.0" y="240.6">needed for: other tables, now(),</tspan><tspan x="470.0" y="254.3">non-immutable functions (updated_at)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="11" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="356.8">VIRTUAL (PG18 default): cheap compute,</tspan><tspan x="50.0" y="370.6">no storage; index via expression only</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="11" fill="#1e1e1e" text-anchor="start"><tspan x="470.0" y="356.8">STORED: expensive compute or logical</tspan><tspan x="470.0" y="370.6">replication subscriber needs the value</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="11" fill="#1e1e1e" text-anchor="start"><tspan x="185.0" y="116.8">yes</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="11" fill="#1e1e1e" text-anchor="start"><tspan x="515.0" y="116.8">no</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="11" fill="#1e1e1e" text-anchor="start"><tspan x="470.0" y="463.8">Trigger risks: bypassed by UPDATE OF gaps,</tspan><tspan x="470.0" y="477.6">switched off via session_replication_role,</tspan><tspan x="470.0" y="491.3">fails late after column rename (body not tracked)</tspan></text>
</svg>
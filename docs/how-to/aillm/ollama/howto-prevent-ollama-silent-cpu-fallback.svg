<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="22" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="37.6">Ollama silent CPU fallback: detect -&gt; fix flow</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="80.0" y="117.0">ollama ps while querying:</tspan><tspan x="80.0" y="135.8">PROCESSOR == 100% GPU?</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="460.0" y="127.0">OK - no action</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="460.0" y="255.4">Silent CPU fallback!</tspan><tspan x="460.0" y="271.6">(35-45 tok/s -&gt; ~1.2 tok/s,</tspan><tspan x="460.0" y="287.9">CPU fans spike, no error)</tspan><tspan x="460.0" y="304.1">journalctl -u ollama | grep load_tensors</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="860.0" y="255.4">Fix:</tspan><tspan x="860.0" y="271.6">OLLAMA_FLASH_ATTENTION=1</tspan><tspan x="860.0" y="287.9">OLLAMA_KV_CACHE_TYPE=q8_0</tspan><tspan x="860.0" y="304.1">Modelfile: num_ctx 8192, num_gpu &lt;full&gt;</tspan><tspan x="860.0" y="320.4">watchdog script on 'ollama ps'</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="360.0" y="120.4">yes</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="215.0" y="235.4">no</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="80.0" y="255.4">Triggers: KV-cache growth,</tspan><tspan x="80.0" y="271.6">unbound num_ctx (32k-128k),</tspan><tspan x="80.0" y="287.9">desktop/browser CUDA overhead</tspan><tspan x="80.0" y="304.1">(0.6-1.5 GB VRAM)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#495057" text-anchor="start"><tspan x="60.0" y="410.4">VRAM ~760-1000 GB/s vs PCIe ~31.5 GB/s: even 2/48 CPU layers stall every token</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="27.8">Stateful agent lifecycle on Agent Substrate (actor-based, K8s worker pools)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="263.2">1 Initialize</tspan><tspan x="72.0" y="280.7">task + exec context</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="352.0" y="263.2">2 Execute</tspan><tspan x="352.0" y="280.7">reason, tools, state update</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="632.0" y="263.2">3 Persist</tspan><tspan x="632.0" y="280.7">durable checkpoint</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="480.0" y="364.6">execute/persist may loop</tspan><tspan x="480.0" y="379.6">(retries, tool calls)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="463.2">4 Suspend</tspan><tspan x="72.0" y="480.7">idle: release resources</tspan><tspan x="72.0" y="498.2">(checkpoint RAM + writable FS)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="352.0" y="463.2">5 Resume / Recover</tspan><tspan x="352.0" y="480.7">restore from checkpoint,</tspan><tspan x="352.0" y="498.2">no duplicate side effects</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="632.0" y="463.2">6 Complete</tspan><tspan x="632.0" y="480.7">outcome + audit history</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="613.2">Runtime layer: actor lifecycle mgmt + checkpoint/restore (sub-500ms resume, 500+ activations/s)</tspan><tspan x="72.0" y="630.7">worker pools + isolation (gVisor / microVM) + Kubernetes provisioning</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="72.0" y="703.2">CAVEAT: runtime restores STATE, not ACTION correctness -&gt; app layer still needs</tspan><tspan x="72.0" y="720.7">idempotency keys, durable operation records, transactional outbox, reconciliation</tspan></text>
</svg>
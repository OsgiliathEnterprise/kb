<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="27.8">Socket.IO whiteboard: event flow through rooms</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="135.0" y="95.0">Client A</tspan><tspan x="135.0" y="112.5">draws a line</tspan><tspan x="135.0" y="129.9">emit('draw', {from,to,color})</tspan><tspan x="135.0" y="147.4">+ optimistic local render</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="395.0" y="95.0">Server</tspan><tspan x="395.0" y="112.5">validate payload + authorize</tspan><tspan x="395.0" y="129.9">look up room (boardId)</tspan><tspan x="395.0" y="147.4">socket.to(room).emit(...)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="655.0" y="95.0">Client B (+ others)</tspan><tspan x="655.0" y="112.5">joined room board-123</tspan><tspan x="655.0" y="129.9">render incoming op</tspan><tspan x="655.0" y="147.4">dedup by op id</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="395.0" y="258.7">On reconnect: snapshot +</tspan><tspan x="395.0" y="276.2">replay ops; rate limits,</tspan><tspan x="395.0" y="293.7">payload caps, persistence</tspan></text>

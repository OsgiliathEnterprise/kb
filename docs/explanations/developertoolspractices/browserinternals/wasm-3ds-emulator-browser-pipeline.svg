<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="22.8">panda3ds-wasm: guest ARM to browser machine code + measured bottlenecks</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="120.0" y="96.2">Guest ARM</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="320.0" y="96.2">Dynarmic IR</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="520.0" y="96.2">WASM backend</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="720.0" y="96.2">browser engine JIT</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="920.0" y="96.2">machine code</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="120.0" y="175.2">PICA graphics -&gt; WebGL2</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="365.0" y="173.6">iPhone: WKWebView, no JIT entitlement (WebKit compiles WASM)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="260.0" y="257.6">Bottleneck 1: glBufferSubData ~30-40us/call x 500+/frame -&gt; buffer orphaning (glBufferData): 15-22 -&gt; 60 fps (hidden in headless Chrome)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="720.0" y="257.6">Bottleneck 2: one WASM instance per guest block -&gt; JSCE executable-memory crash; pack 256 blocks/instance + shared helper table: 19 -&gt; 44 Hz (Safari/Mac)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="475.0" y="333.6">Open: heavy iPhone scene 16-22 Hz; removing all draw calls -&gt; 59-63 Hz; 1-frame replay (8,711 WebGL calls, 345 draws) at ~59 Hz misses cross-frame texture/render-target dependencies</tspan></text>

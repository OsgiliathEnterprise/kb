<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="39.2">Repository access as shared infrastructure (GitFarm pattern)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#c92a2a" text-anchor="start"><tspan x="60.0" y="82.8">Naive: every agent clones everything</tspan></text>

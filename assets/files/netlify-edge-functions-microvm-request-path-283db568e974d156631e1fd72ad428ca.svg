<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="150.0" y="34.4">Netlify Edge Functions: request path on Firecracker MicroVMs (with Unikraft)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="84.4">Client</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="264.4">Edge node: TLS termination + route match; writes machine spec (runtime/platform/function images + CPU/mem limits); spec hash -&gt; service ID</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="404.4">Compute node chosen by rendezvous hashing (stickiness keeps MicroVM warm; relaxed above threshold to avoid hot spots)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="544.4">Firecracker MicroVM: created &lt;1 ms, starts ~2 ms p99; stripped-down Linux guest (Unikraft); function files as memory-mapped EROFS image</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="684.4">Snapshot after JS server listens -&gt; scale to zero when idle; restore from memory-mapped snapshot on next invocation</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1971c2" text-anchor="start"><tspan x="150.0" y="740.4">Measured: p50 warm latency ~5-6 ms (was 25-40 ms on V8 isolates), p99 47.4% faster, 99.998% availability; cold invocations ~1.2% of traffic at ~9 ms avg</tspan></text>
</svg>
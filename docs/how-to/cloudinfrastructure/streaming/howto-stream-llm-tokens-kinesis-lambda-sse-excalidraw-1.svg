<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="27.8">LLM token pipeline: Claude -&gt; Kinesis (EFO) -&gt; Lambda -&gt; SSE</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="125.0" y="98.7">Claude API</tspan><tspan x="125.0" y="116.2">stream=true</tspan><tspan x="125.0" y="133.7">one token per line</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="355.0" y="90.0">Proxy Lambda</tspan><tspan x="355.0" y="107.5">PutRecord</tspan><tspan x="355.0" y="125.0">PartitionKey=userId</tspan><tspan x="355.0" y="142.4">(per-chat ordering)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="595.0" y="90.0">Kinesis stream</tspan><tspan x="595.0" y="107.5">2 shards</tspan><tspan x="595.0" y="125.0">1 MiB/s write each</tspan><tspan x="595.0" y="142.4">2 MiB/s read shared</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="595.0" y="229.9">Consumer Lambda</tspan><tspan x="595.0" y="247.4">GetShardIterator(ConsumerARN)</tspan><tspan x="595.0" y="264.9">= enhanced fan-out</tspan><tspan x="595.0" y="282.4">iterator refresh every 5 min</tspan></text>

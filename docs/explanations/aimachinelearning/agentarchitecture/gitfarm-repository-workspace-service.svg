<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="572.0" y="123.2">Agent pool</tspan><tspan x="572.0" y="140.7">(short-lived)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="802.0" y="117.2">Repo Workspace Service</tspan><tspan x="802.0" y="134.7">warm pool, &lt;1s checkout</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="802.0" y="207.2">Centrally managed:</tspan><tspan x="802.0" y="224.7">revision pin, freshness,</tspan><tspan x="802.0" y="242.2">command allowlist,</tspan><tspan x="802.0" y="259.7">secrets &amp; audit</tspan></text>

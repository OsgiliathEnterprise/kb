<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="39.2">Data contracts: schema + guarantees as a versioned interface (ODCS)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="150.8">Producer publishes contract</tspan><tspan x="70.0" y="170.8">(ODCS YAML in Git): schema,</tspan><tspan x="70.0" y="190.8">quality rules, ownership, SLAs,</tspan><tspan x="70.0" y="210.8">terms of use, AI context</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="350.0" y="150.8">CI/CD gate: data validated</tspan><tspan x="350.0" y="170.8">against contract on every</tspan><tspan x="350.0" y="190.8">commit; breaking changes</tspan><tspan x="350.0" y="210.8">caught before consumers break</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="630.0" y="150.8">Consumers incl. AI agents</tspan><tspan x="630.0" y="170.8">read the metadata: catalog,</tspan><tspan x="630.0" y="190.8">lineage, chat-with-data,</tspan><tspan x="630.0" y="210.8">pipeline generation</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="910.0" y="150.8">Consumer-driven contracts:</tspan><tspan x="910.0" y="170.8">same ODCS structure states</tspan><tspan x="910.0" y="190.8">expectations, not promises;</tspan><tspan x="910.0" y="210.8">contract-first discovery</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="1190.0" y="150.8">Open standard (Linux Fdn) =</tspan><tspan x="1190.0" y="170.8">metadata sovereignty; plain</tspan><tspan x="1190.0" y="190.8">files in Git, no lock-in</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="17" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="47.6">jQuery selector ReDoS: catastrophic backtracking in identifier regex (fixed in 4.1.0 / 3.8.0)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="115.2">Attacker input:</tspan><tspan x="72.0" y="132.7">[attr=\x41\x42\x43...\xZZ]</tspan><tspan x="72.0" y="150.2">long hex-escape chain</tspan><tspan x="72.0" y="167.7">+ invalid char</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="245.2">Old regex: ambiguous branches</tspan><tspan x="72.0" y="262.7">-&gt; exponential backtracking</tspan><tspan x="72.0" y="280.2">-&gt; ~120s main-thread hang</tspan><tspan x="72.0" y="297.7">(page frozen, no error)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="552.0" y="245.2">Fixed regex: explicitly excludes</tspan><tspan x="552.0" y="262.7">digits &amp; hex where CSS spec requires;</tspan><tspan x="552.0" y="280.2">invalid escapes -&gt; U+FFFD</tspan><tspan x="552.0" y="297.7">-&gt; resolved in ~ms</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="384.4">Vector: $(userInput) / find(userInput) / '[id=&quot;'+input+'&quot;]'  -- DoS of your own users' tabs; audit any lib compiling user input to regex/selectors</tspan></text>

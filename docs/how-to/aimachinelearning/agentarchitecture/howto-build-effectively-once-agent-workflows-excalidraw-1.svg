<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="492.0" y="227.8">Kafka outbox</tspan><tspan x="492.0" y="247.8">dedup on operationId</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="302.8">Retries may repeat HTTP attempts, graph invocations and polls — but never a business effect.</tspan><tspan x="40.0" y="322.8">App Attest = integrity/anti-replay (fresh assertion per retry); operationId = business dedup. Don't conflate them.</tspan></text>

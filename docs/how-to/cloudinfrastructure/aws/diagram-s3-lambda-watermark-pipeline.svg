<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="36.0">S3 + Lambda media watermarking pipeline (replace-in-place)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="102.4">Flutter / client</tspan><tspan x="50.0" y="118.7">asks backend for</tspan><tspan x="50.0" y="134.9">presigned PUT URL</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="310.0" y="102.4">Direct upload to S3</tspan><tspan x="310.0" y="118.7">uploads/ (public-read</tspan><tspan x="310.0" y="134.9">via bucket policy)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="570.0" y="102.4">ObjectCreated event</tspan><tspan x="570.0" y="118.7">triggers Lambda</tspan><tspan x="570.0" y="134.9">(Node, x86_64, 1GB, 20s)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="830.0" y="102.4">Image: Sharp overlay</tspan><tspan x="830.0" y="118.7">Video: FFmpeg from</tspan><tspan x="830.0" y="134.9">Lambda layer</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="1090.0" y="102.4">Write watermark-tmp/</tspan><tspan x="1090.0" y="118.7">then CopyObject over</tspan><tspan x="1090.0" y="134.9">original key, delete tmp</tspan><tspan x="1090.0" y="151.2">(no feedback loop)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="281.2">Gotchas: ACLs disabled -&gt; presigned PUT must NOT set ACL ('AccessControlListNotSupported');</tspan><tspan x="50.0" y="298.7">bucket policy grants GetObject only (NOT GetObjectVersion) so un-watermarked versions stay private;</tspan><tspan x="50.0" y="316.2">IAM: GetObject/PutObject on bucket, DeleteObject scoped to watermark-tmp/*; x86_64 required for Sharp+FFmpeg binaries</tspan></text>
</svg>
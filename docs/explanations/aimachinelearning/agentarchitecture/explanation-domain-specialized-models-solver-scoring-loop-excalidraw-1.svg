<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">Maestro scoring loop: the domain's OWN tools judge the agent</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="140.0" y="104.6">Agent (Super Agent</tspan><tspan x="140.0" y="119.6">in Chip/Inno/Aura/ViraStack)</tspan><tspan x="140.0" y="134.6">proposes design output</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="420.0" y="97.1">DETERMINISTIC SOLVERS</tspan><tspan x="420.0" y="112.1">+ EDA tools score output</tspan><tspan x="420.0" y="127.1">against goals, constraints,</tspan><tspan x="420.0" y="142.1">ground truth</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="420.0" y="254.6">Verdict feeds the</tspan><tspan x="420.0" y="269.6">RL REWARD</tspan><tspan x="420.0" y="284.6">(post-training loop)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="342.8">Why it matters: in chip design the domain already HAS ground truth (solvers, simulators,</tspan><tspan x="40.0" y="362.8">verification suites) - so the reward signal is OBJECTIVE, unlike open-ended domains.</tspan></text>

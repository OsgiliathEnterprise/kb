<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="690.0" y="462.4">Result: 200 OK — data delivered. No login, no invoice, no card network.</tspan><tspan x="690.0" y="479.9">Fees: network gas only (often &lt; $0.01), no protocol fee.</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="430.0" y="32.8">Cloudflare Security Audit Skill: Six Phases, Independent Verification</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="112.5" y="122.1">1. RECON</tspan><tspan x="112.5" y="137.1">architecture.md</tspan><tspan x="112.5" y="152.1">coverage-ledger.json</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="302.5" y="122.1">2. COVERAGE-LED HUNTING</tspan><tspan x="302.5" y="137.1">isolated hunters per ledger unit</tspan><tspan x="302.5" y="152.1">critics find gaps</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="492.5" y="129.6">3. CANDIDATE VALIDATION</tspan><tspan x="492.5" y="144.6">fresh verifier tries to DISPROVE each candidate</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="682.5" y="122.1">4. STRUCTURED OUTPUT</tspan><tspan x="682.5" y="137.1">findings.json vs report-schema.json</tspan><tspan x="682.5" y="152.1">confirmed / needs_validation / rejected</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="682.5" y="252.1">5. INDEPENDENT RECORD VERIFICATION</tspan><tspan x="682.5" y="267.1">fresh agents verify source claims</tspan><tspan x="682.5" y="282.1">material replacement -&gt; another verifier</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="872.5" y="244.6">6. TARGET-NEUTRAL REPORTING</tspan><tspan x="872.5" y="259.6">REPORT.md</tspan><tspan x="872.5" y="274.6">FINDINGS-DETAIL.md</tspan><tspan x="872.5" y="289.6">NEEDS-VALIDATION.md</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="220.0" y="374.6">Validators (zero-dependency Node):</tspan><tspan x="220.0" y="389.6">validate-coverage-ledger.cjs after every ledger update</tspan><tspan x="220.0" y="404.6">validate-findings.cjs in Phase 4 + after each Phase 5 replacement</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="670.0" y="374.6">Sandbox requirement: no external network,</tspan><tspan x="670.0" y="389.6">allowlisted env, resource limits, scratch-only writes</tspan><tspan x="670.0" y="404.6">(no sandbox -&gt; leads stay needs_validation)</tspan></text>

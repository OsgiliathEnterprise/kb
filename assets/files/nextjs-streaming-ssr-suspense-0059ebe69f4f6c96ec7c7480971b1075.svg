<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="150.0" y="32.8">Streaming SSR: static shell flushes first, Suspense boundaries stream in later</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="129.6">Server: renders static shell (layout + fast data)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="750.0" y="129.6">Browser: paints shell immediately (low TTFB/FCP)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="380.0" y="79.6">chunk 1: shell + skeletons (Transfer-Encoding: chunked)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="239.6">Slow RSC resolves (e.g. 3s aggregation query)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="750.0" y="239.6">Browser: streams finished HTML into the same open connection</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="380.0" y="189.6">chunk N: boundary HTML replaces skeleton (no full re-hydration)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="470.0" y="344.6">Independent Suspense boundaries fetch in parallel: total page time = max(queries), not sum</tspan></text>
</svg>
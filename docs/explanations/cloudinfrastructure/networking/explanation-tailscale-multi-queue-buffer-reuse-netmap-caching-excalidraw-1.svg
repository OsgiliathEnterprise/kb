<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 -4.0 848.0 388.0" width="848" height="388">
<rect x="16.0" y="-4.0" width="848.0" height="388.0" fill="#ffffff"/>
<rect x="40.0" y="90.0" width="110.0" height="50.0" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="190.0" y="90.0" width="130.0" height="50.0" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="360.0" y="90.0" width="110.0" height="50.0" rx="8" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="40.0" y="210.0" width="360.0" height="34.0" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<rect x="40.0" y="250.0" width="360.0" height="34.0" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<rect x="40.0" y="290.0" width="360.0" height="34.0" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>
<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 150.0 115.0 L 190.0 115.0"/><line x1="190.0" y1="115.0" x2="177.4" y2="108.9"/><line x1="190.0" y1="115.0" x2="177.4" y2="121.1"/></g>
<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 320.0 115.0 L 360.0 115.0"/><line x1="360.0" y1="115.0" x2="347.4" y2="108.9"/><line x1="360.0" y1="115.0" x2="347.4" y2="121.1"/></g>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">Tailscale forwarding pipeline: single ordered lane vs multi-queue (per-stream lanes)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="40.0" y="71.2">Before: one ordered single-threaded pipeline</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="115.2">Reader</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="202.0" y="115.2">Crypto (shared)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="372.0" y="115.2">Writer</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#2f9e44" text-anchor="start"><tspan x="40.0" y="191.2">After: parallel lanes, one per stream (stays in lane)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="230.2">stream A: Reader -&gt; Crypto -&gt; Writer</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="270.2">stream B: Reader -&gt; Crypto -&gt; Writer</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="310.2">stream C: Reader -&gt; Crypto -&gt; Writer</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="460.0" y="221.2">Lane count scales to machine resources,</tspan><tspan x="460.0" y="238.7">NOT peer count. Per-stream ordering preserved</tspan><tspan x="460.0" y="256.2">because each stream stays in its lane.</tspan><tspan x="460.0" y="273.7">Also: small packets no longer copied into</tspan><tspan x="460.0" y="291.2">private 64 KiB buffers (~5% speedup),</tspan><tspan x="460.0" y="308.7">writev scatter-gather writes, netmap caching</tspan><tspan x="460.0" y="326.2">for faster startup (warm start 10-100x).</tspan></text>
</svg>
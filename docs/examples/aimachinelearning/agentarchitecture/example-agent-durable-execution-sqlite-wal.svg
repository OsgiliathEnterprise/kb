<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="36.0">Durable agent run: intent -&gt; effect -&gt; checkpoint</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="106.2">step i: (idempotency_key,</tspan><tspan x="75.0" y="123.7"> action)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="201.2">1. log INTENT to WAL</tspan><tspan x="75.0" y="218.7">   (durable, pre-effect)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="311.2">2. execute side effect</tspan><tspan x="75.0" y="328.7">   (tool call / API)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="421.2">3. write CHECKPOINT</tspan><tspan x="75.0" y="438.7">   completed=i+1, results</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="395.0" y="403.2">crash anywhere?</tspan><tspan x="395.0" y="420.7">resume = read latest checkpoint</tspan><tspan x="395.0" y="438.2">+ reconcile unacked intents</tspan><tspan x="395.0" y="455.7">(replay log, never the world)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="395.0" y="541.2">chat-history replay (anti-pattern):</tspan><tspan x="395.0" y="558.7">costly position rebuild, context drift,</tspan><tspan x="395.0" y="576.2">re-executes side effects</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="36.0">Password spraying via residential proxies: why per-IP bans fail, what works</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="100.4">Spray: 615 IPs / 616 attempts</tspan><tspan x="72.0" y="116.7">86% US residential, 1 try per IP,</tspan><tspan x="72.0" y="132.9">1 attempt every ~4 min</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="220.4">Recon: guesses nonexistent</tspan><tspan x="72.0" y="236.7">firstname.lastname@ addresses;</tspan><tspan x="72.0" y="252.9">switches when real one responds</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="432.0" y="112.4">'5 fails/10min per IP'</tspan><tspan x="432.0" y="128.7">NEVER FIRES</tspan><tspan x="432.0" y="144.9">(datacenter-block useless)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="762.0" y="108.4">Actual entry = phishing click</tspan><tspan x="762.0" y="124.7">('reconfirm mailbox'), then</tspan><tspan x="762.0" y="140.9">login from Nigeria +13h</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="432.0" y="238.4">WORKS: geo-aware fail2ban — maxretry=1 + ignorecommand</tspan><tspan x="432.0" y="254.7">GeoLite2 home-country check =&gt; 1 failure from abroad = 30d ban;</tspan><tspan x="432.0" y="270.9">firewalld ipset blocks confirmed IPs; alert on SUCCESSES abroad</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="350.4">Never roll passwords back before checking compromise (attacker held them). Never whitelist 'anyone who ever logged in'. Rotate all, kill sessions, deliver via single-use link + out-of-band code. Scan all tenants same day.</tspan></text>
</svg>
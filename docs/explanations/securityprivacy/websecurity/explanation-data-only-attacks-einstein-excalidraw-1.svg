<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="180.0" y="34.4">Einstein: data-only attack generation (two stages)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="102.4">Instrument victim binary</tspan><tspan x="55.0" y="118.7">(dynamic taint analysis)</tspan><tspan x="55.0" y="134.9">start after initialization</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="365.0" y="102.4">Model arbitrary memory-write bug:</tspan><tspan x="365.0" y="118.7">taint all corruptible data</tspan><tspan x="365.0" y="134.9">(unique color per datum)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="675.0" y="102.4">Run benign workload (test suite)</tspan><tspan x="675.0" y="118.7">track taint into security-sensitive</tspan><tspan x="675.0" y="134.9">syscalls (execve, write, ...)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="365.0" y="242.4">Find identity dataflows:</tspan><tspan x="365.0" y="258.6">syscall args copied verbatim from</tspan><tspan x="365.0" y="274.9">tainted data -&gt; candidate exploits</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="242.4">Confirm: restart server, apply</tspan><tspan x="55.0" y="258.6">(addr,val) overwrite at bug point,</tspan><tspan x="55.0" y="274.9">replay workload, verify effect</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#862e9c" text-anchor="start"><tspan x="660.0" y="245.4">Syscall chaining: state shared</tspan><tspan x="660.0" y="261.6">across syscalls lets one safe call</tspan><tspan x="660.0" y="277.9">set up another (open + write)</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 -9.0 628.0 343.0" width="628" height="343">
<rect x="16.0" y="-9.0" width="628.0" height="343.0" fill="#ffffff"/>
<rect x="40.0" y="60.0" width="260.0" height="120.0" rx="0" fill="#f9d3d3" stroke="#e03131" stroke-width="1.5"/>
<rect x="340.0" y="60.0" width="280.0" height="120.0" rx="0" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/>
<rect x="340.0" y="220.0" width="280.0" height="90.0" rx="0" fill="#d9ccff" stroke="#1e1e1e" stroke-width="1.5"/>
<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 300.0 120.0 L 340.0 120.0"/><line x1="340.0" y1="120.0" x2="327.4" y2="113.9"/><line x1="340.0" y1="120.0" x2="327.4" y2="126.1"/></g>
<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 480.0 180.0 L 480.0 220.0"/><line x1="480.0" y1="220.0" x2="486.1" y2="207.4"/><line x1="480.0" y1="220.0" x2="473.9" y2="207.4"/></g>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="27.8">Oversell race vs atomic conditional update (stock = 1)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="170.0" y="96.2">Read-check-write (BROKEN)</tspan><tspan x="170.0" y="113.7">A: read stock=1</tspan><tspan x="170.0" y="131.2">B: read stock=1</tspan><tspan x="170.0" y="148.7">A: write stock=0</tspan><tspan x="170.0" y="166.2">B: write stock=-1  -&gt; 2 units sold</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="480.0" y="96.2">Atomic conditional update</tspan><tspan x="480.0" y="113.7">UPDATE ... SET stock=stock-1</tspan><tspan x="480.0" y="131.2">WHERE id=$1 AND stock&gt;0 RETURNING</tspan><tspan x="480.0" y="148.7">A: 1 row -&gt; reserved</tspan><tspan x="480.0" y="166.2">B: 0 rows -&gt; out of stock</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="480.0" y="258.7">Group in one transaction</tspan><tspan x="480.0" y="276.2">+ order INSERT; 0 rows or failure</tspan><tspan x="480.0" y="293.7">-&gt; ROLLBACK, no partial state</tspan></text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="36.0 -9.0 816.0 371.8" width="816" height="372">
<rect x="36.0" y="-9.0" width="816.0" height="371.8" fill="#ffffff"/>
<rect x="60.0" y="60.0" width="220.0" height="110.0" rx="8" fill="#d0ebff" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="320.0" y="60.0" width="220.0" height="110.0" rx="8" fill="#d0ebff" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="580.0" y="60.0" width="220.0" height="110.0" rx="8" fill="#d0ebff" stroke="#1e1e1e" stroke-width="1.5"/>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="27.8">Test sharding: wall clock shrinks, the bill grows (12-file suite, 2-vCPU runner)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="90.4">1 job</tspan><tspan x="75.0" y="106.7">wall 26.8 s</tspan><tspan x="75.0" y="122.9">billed 26.8 s</tspan><tspan x="75.0" y="139.2">(1 min)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="335.0" y="90.4">2 shards</tspan><tspan x="335.0" y="106.7">wall 13.8 s</tspan><tspan x="335.0" y="122.9">billed 27.5 s</tspan><tspan x="335.0" y="139.2">(2 min)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="595.0" y="90.4">4 shards</tspan><tspan x="595.0" y="106.7">wall 9.3 s</tspan><tspan x="595.0" y="122.9">billed 29.0 s</tspan><tspan x="595.0" y="139.2">(4 min!)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="210.4">Why: only test execution divides.</tspan><tspan x="60.0" y="226.7">Setup (checkout, install, toolchain) repeats on every shard.</tspan><tspan x="60.0" y="242.9">Wall clock = slowest shard.  Bill = all shards, rounded UP to a minute per job.</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1971c2" text-anchor="start"><tspan x="60.0" y="300.4">Decision: add a shard only while the wall-clock gain beats one</tspan><tspan x="60.0" y="316.6">fixed setup cost per extra billed minute. Balance by recorded durations,</tspan><tspan x="60.0" y="332.9">not file count (unlucky split cost 22% wall clock in the measured run).</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="350.0" y="29.6">Java sealed types: exhaustive checking + the breaking-change trap</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" y="124.6">Sealed type (JEP 409, Java 17)</tspan><tspan x="190.0" y="139.6">explicit permitted subtypes</tspan><tspan x="190.0" y="154.6">~ ADT: data T = A | B</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="590.0" y="124.6">Exhaustive switch</tspan><tspan x="590.0" y="139.6">no default clause needed</tspan><tspan x="590.0" y="154.6">missing case = compile error</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="400.0" y="304.6">Add new subtype to EXPORTED sealed type</tspan></text>

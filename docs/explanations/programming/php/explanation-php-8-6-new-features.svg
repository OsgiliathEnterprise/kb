<rect x="340.0" y="90.0" width="260.0" height="170.0" rx="8" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.5"/>
<rect x="640.0" y="90.0" width="260.0" height="170.0" rx="8" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="1.5"/>

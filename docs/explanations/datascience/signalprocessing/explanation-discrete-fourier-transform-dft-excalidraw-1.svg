<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="150.0" y="168.7">N time samples</tspan><tspan x="150.0" y="186.2">x[n], n=0..N-1</tspan><tspan x="150.0" y="203.7">(finite-duration signal)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="465.0" y="168.7">Assume block = one full period</tspan><tspan x="465.0" y="186.2">=&gt; DTFS coefficients a_k</tspan><tspan x="465.0" y="203.7">X[k] = N * a_k</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="795.0" y="168.7">DFT as matrix product</tspan><tspan x="795.0" y="186.2">X = F . x</tspan><tspan x="795.0" y="203.7">F = Fourier matrix (roots of unity)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="1115.0" y="168.7">Frequency bins X[k]</tspan><tspan x="1115.0" y="186.2">= N equally spaced</tspan><tspan x="1115.0" y="203.7">samples of the DTFT</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="795.0" y="368.7">Inverse: F . Fc = N.I</tspan><tspan x="795.0" y="386.2">x = (Fc / N) . X</tspan><tspan x="795.0" y="403.7">exact reconstruction</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="39.2">OAuth refresh path after the token-rotation incident (persist like money)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="129.2">Scheduled</tspan><tspan x="55.0" y="146.7">refresh job</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="320.0" y="129.2">Distributed lock</tspan><tspan x="320.0" y="146.7">per connection</tspan><tspan x="320.0" y="164.2">(no duplicate refresh)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="595.0" y="129.2">Provider token</tspan><tspan x="595.0" y="146.7">endpoint</tspan><tspan x="595.0" y="164.2">(rotation may fire)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="860.0" y="129.2">PERSIST new refresh</tspan><tspan x="860.0" y="146.7">token FIRST,</tspan><tspan x="860.0" y="164.2">then everything else</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="445.0" y="299.2">If rotation already invalidated the old token and persist failed:</tspan><tspan x="445.0" y="316.7">connection is DEAD — user must re-consent (Airtable, Atlassian;</tspan><tspan x="445.0" y="334.2">Salesforce/Slack with rotation enabled). Xero allows retry with the</tspan><tspan x="445.0" y="351.7">previous refresh token for 30 minutes.</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="299.2">Providers that never rotate: old token keeps</tspan><tspan x="55.0" y="316.7">working — next refresh heals the connection</tspan><tspan x="55.0" y="334.2">(the 2h incident was cheap here, unrecoverable there)</tspan></text>
</svg>
<rect x="40.0" y="70.0" width="360.0" height="150.0" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="1.5"/>
<rect x="460.0" y="70.0" width="380.0" height="150.0" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.5"/>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="120.0" y="32.8">CVE-2026-119618: race in mod_http2 assign_headers() -&gt; heap corruption -&gt; RCE (fixed in httpd 2.4.71)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="122.4">HTTP/2 stream A</tspan><tspan x="75.0" y="138.7">thread -&gt; assign_headers()</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="232.4">HTTP/2 stream B</tspan><tspan x="75.0" y="248.7">thread -&gt; assign_headers()</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="355.0" y="175.4">Shared header memory</tspan><tspan x="355.0" y="191.7">NO LOCK -&gt; concurrent</tspan><tspan x="355.0" y="207.9">read/write (CWE-362)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="645.0" y="168.4">Heap corruption</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="645.0" y="238.4">Remote code execution</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1971c2" text-anchor="start"><tspan x="60.0" y="320.4">Mitigation: upgrade to 2.4.71 (2026-11-11). No vendor workaround - if you cannot patch,</tspan><tspan x="60.0" y="336.6">fall back to Protocols http/1.1 on HTTP/2-enabled servers and watch for worker crashes.</tspan></text>

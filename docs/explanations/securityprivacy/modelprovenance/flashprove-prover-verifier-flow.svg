<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="27.8">FlashProve: provable inference — commit, prove, verify</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="93.2">Provider (prover)</tspan><tspan x="72.0" y="110.7">GPU prover, single H100:</tspan><tspan x="72.0" y="128.2">&gt;100 tok/s on Llama 4 Maverick</tspan><tspan x="72.0" y="145.7">400B MoE, 4-bit</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="243.2">Weight commitment</tspan><tspan x="72.0" y="260.7">commitment ID binds provider</tspan><tspan x="72.0" y="278.2">to ONE set of weights</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="442.0" y="123.2">Proof artifact</tspan><tspan x="442.0" y="140.7">~19 MB per 1,024-token request</tspan><tspan x="442.0" y="158.2">(70-95x vLLM GPU time)</tspan><tspan x="442.0" y="175.7">covers prompt+response tokens</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="442.0" y="273.2">Verifier (checker)</tspan><tspan x="442.0" y="290.7">C++ fast verifier (not formally verified)</tspan><tspan x="442.0" y="308.2">+ Lean verifier: completeness, soundness,</tspan><tspan x="442.0" y="325.7">zero-knowledge formally proven</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="373.2">Formal basis (Lean)</tspan><tspan x="72.0" y="390.7">C++ verifier + GPU prover tested</tspan><tspan x="72.0" y="408.2">against the formally defined protocol</tspan><tspan x="72.0" y="425.7">but NOT formally verified themselves</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#e03131" text-anchor="start"><tspan x="60.0" y="489.6">Limits today: 1,024-token context; integer-based inference + greedy decoding</tspan><tspan x="60.0" y="504.6">(prod models use float + sampling); research artifact, unmaintained, no API commitment</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">Cloudflare AI Crawl Control — mixed-use crawlers (Sept 2026)</tspan></text>

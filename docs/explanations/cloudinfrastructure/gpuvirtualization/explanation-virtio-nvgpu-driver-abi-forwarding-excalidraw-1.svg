<g stroke="#1e1e1e" stroke-width="1.5" fill="none"><path d="M 650.0 320.0 L 650.0 350.0"/><line x1="650.0" y1="350.0" x2="654.6" y2="340.6"/><line x1="650.0" y1="350.0" x2="645.4" y2="340.6"/></g>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">virtio-nvgpu: driver-ABI forwarding vs API-level translation (Venus)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="95.2">Venus (API-level)</tspan><tspan x="52.0" y="112.7">serialize EVERY draw call</tspan><tspan x="52.0" y="130.2">~2,000 boundary crossings/frame</tspan><tspan x="52.0" y="147.7">cmd buffers built on HOST</tspan><tspan x="52.0" y="165.2">host owns GPU buffers</tspan><tspan x="52.0" y="182.7">NVENC in guest: not viable</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="472.0" y="95.2">virtio-nvgpu (driver-ABI)</tspan><tspan x="472.0" y="112.7">forward /dev/nvidia* ioctls</tspan><tspan x="472.0" y="130.2">~5-20 boundary crossings/frame</tspan><tspan x="472.0" y="147.7">cmd buffers built in GUEST</tspan><tspan x="472.0" y="165.2">guest owns GPU buffers</tspan><tspan x="472.0" y="182.7">NVENC works (real CUDA interop)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="472.0" y="273.2">Guest: app -&gt; NVIDIA user-mode drivers</tspan><tspan x="472.0" y="290.7">GPL driver/ serializes ioctl to virtqueue</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="472.0" y="373.2">Host: device/ crate (Apache) maps guest</tspan><tspan x="472.0" y="390.7">handles -&gt; host FDs, ABI-aware ioctl rewrite</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="261.2">Measured (RTX 3060 / driver 595.99.02):</tspan><tspan x="40.0" y="278.7">- guest within 2% of bare metal above ~2ms/frame</tspan><tspan x="40.0" y="296.2">- CPU: guest 0.37s vs host 0.40s (100fps, 12s)</tspan><tspan x="40.0" y="313.7">- 813,691 frames -&gt; only 13,792 backend messages</tspan><tspan x="40.0" y="331.2">- 4 guests share one card evenly (~25.8 fps each),</tspan><tspan x="40.0" y="348.7">  all encoding H.264 at 60Hz simultaneously</tspan></text>
</svg>
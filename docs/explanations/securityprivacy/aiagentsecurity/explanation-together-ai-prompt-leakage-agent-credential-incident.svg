<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="22" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="37.6">Together AI prompt leakage — attack chain (June-July 2026, disclosed 2026-11-21)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="80.0" y="127.0">Testing prompt samples</tspan><tspan x="80.0" y="145.8">(MiniMax M3, GLM-5.2, Kimi K2.6)</tspan><tspan x="80.0" y="164.5">stored in private HF repo</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="440.0" y="127.0">AI coding agent commits</tspan><tspan x="440.0" y="145.8">HF credential into public</tspan><tspan x="440.0" y="164.5">GitHub repo 'xorl'</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="800.0" y="127.0">Scanner detects + reverts,</tspan><tspan x="800.0" y="145.8">BUT attacker already has</tspan><tspan x="800.0" y="164.5">the credential</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="798.0" y="293.2">Attacker downloads prompts,</tspan><tspan x="798.0" y="310.7">extracts other-service credentials,</tspan><tspan x="798.0" y="328.2">live-tests them (5 Dragos canaries hit)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="80.0" y="286.2">Remediations:</tspan><tspan x="80.0" y="303.7">1. Scoped / short-lived / keyless credentials</tspan><tspan x="80.0" y="321.2">2. Credential checks on ALL pull requests</tspan><tspan x="80.0" y="338.7">3. ZDR default for new accounts (customers: enable ZDR)</tspan><tspan x="80.0" y="356.2">4. Dev-process rules for AI coding agents</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#495057" text-anchor="start"><tspan x="60.0" y="440.4">Lesson: prompts are an un-audited credential store; agents that can git commit are privileged actors.</tspan></text>

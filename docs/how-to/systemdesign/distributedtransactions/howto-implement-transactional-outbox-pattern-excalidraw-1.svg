<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="170.0" y="34.4">Transactional outbox: order + event commit together; relay delivers at-least-once</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="112.4">Order service</tspan><tspan x="55.0" y="128.7">single DB transaction:</tspan><tspan x="55.0" y="144.9">INSERT orders + INSERT outbox_events</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="355.0" y="112.4">Relay (poller)</tspan><tspan x="355.0" y="128.7">reads unsent rows</tspan><tspan x="355.0" y="144.9">publishes + marks sent_at</tspan><tspan x="355.0" y="161.2">retries indefinitely</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="655.0" y="112.4">Message broker</tspan><tspan x="655.0" y="128.7">(can be down for hours;</tspan><tspan x="655.0" y="144.9">delivery just delays)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="655.0" y="252.4">Fulfilment consumer</tspan><tspan x="655.0" y="268.6">dedupes on event_id</tspan><tspan x="655.0" y="284.9">(idempotent handler)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="355.0" y="252.4">ALERT: age of oldest unsent</tspan><tspan x="355.0" y="268.6">outbox row &gt; 2 min</tspan><tspan x="355.0" y="284.9">(fired 3x post-deploy)</tspan></text>
</svg>
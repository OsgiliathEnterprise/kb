<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="300.0" y="539.6">takeaway: sealed types shine inside one module (recompiled together); across public APIs they add runtime breakage modes</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="22" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="37.6">uBlock Origin UXSS - website-driven element picker attack chain</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="90.0" y="100.8">Malicious website</tspan><tspan x="90.0" y="120.8">hooks XMLHttpRequest.open</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="90.0" y="220.8">Trigger no-fetch-if filter</tspan><tspan x="90.0" y="240.8">-&gt; leak moz-extension UUID</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="90.0" y="340.8">Invisible iframe:</tspan><tspan x="90.0" y="360.8">epicker-ui.html (web-accessible)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="90.0" y="460.8">postMessage: showDialog + opt=</tspan><tspan x="90.0" y="480.8">&quot;image\ngoogle.com##+js(trusted-rpnt...)&quot;</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="90.0" y="580.8">Victim's ordinary click hits</tspan><tspan x="90.0" y="600.8">invisible 'Create' button</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="90.0" y="700.8">Arbitrary TRUSTED filter added</tspan><tspan x="90.0" y="720.8">-&gt; scriptlet injects JS on any site</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="640.0" y="136.0">Fix: picker now requires a secret</tspan><tspan x="640.0" y="161.0">password from the content script</tspan><tspan x="640.0" y="186.0">in the initial postMessage</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="640.0" y="336.0">Filters stay trusted until the next</tspan><tspan x="640.0" y="361.0">recompile - attacker navigates</tspan><tspan x="640.0" y="386.0">immediately to the victim page</tspan></text>

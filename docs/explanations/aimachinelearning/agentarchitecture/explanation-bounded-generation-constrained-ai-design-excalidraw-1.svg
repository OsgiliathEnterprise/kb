<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="80.0" y="49.2">Bounded Generation: Reference Architecture</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="146.2">Deterministic parametric graph</tspan><tspan x="75.0" y="163.7">(Dynamo) - the ONLY geometry source</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="415.0" y="145.4">Typed, bounded parameter schema</tspan><tspan x="415.0" y="161.7">(semantic names, authored bounds,</tspan><tspan x="415.0" y="177.9">couplings) = the contract</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="755.0" y="146.2">AI advisory layer</tspan><tspan x="755.0" y="163.7">no path to raw geometry</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="415.0" y="285.4">Deterministic evaluator</tspan><tspan x="415.0" y="301.6">watertight / manifold, volume,</tspan><tspan x="415.0" y="317.9">reproducibility fingerprint</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="665.0" y="210.4">candidate</tspan><tspan x="665.0" y="226.7">parameters</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="300.0" y="310.4">build + check</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#8c2b2b" text-anchor="start"><tspan x="400.0" y="381.2">reconcile-before-trust: exit 0 != success - diff against the evaluator</tspan><tspan x="400.0" y="398.7">AI may propose values only; geometry always comes from the graph</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#555555" text-anchor="start"><tspan x="400.0" y="431.2">validity by construction; designs reviewable as diffs (parameter changes)</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="165.0" y="99.2">JDK 26: FreeRatio 40/70</tspan><tspan x="165.0" y="115.4">shrinks heap after Full GC</tspan><tspan x="165.0" y="131.7">based on arbitrary %</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="165.0" y="249.2">JDK 27: defaults 0/100</tspan><tspan x="165.0" y="265.4">heuristic disabled</tspan><tspan x="165.0" y="281.6">no post-Full-GC shrink</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="545.0" y="166.0">GC-CPU-usage sizing heuristic</tspan><tspan x="545.0" y="182.3">(kept)</tspan><tspan x="545.0" y="198.5">expands heap when GC takes</tspan><tspan x="545.0" y="214.8">too much CPU</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="342.8">Old defaults made the two sizing heuristics undo each other's heap changes</tspan><tspan x="40.0" y="362.8">right after a full heap GC — unnecessary churn, performance issues.</tspan></text>

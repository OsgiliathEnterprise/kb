<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="90.0" y="26.0">Formalizing CPython in Lean: per-function pipeline</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="84.4">Copy</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="109.6">line-by-line Lean copy of</tspan><tspan x="70.0" y="124.6">the C function, incl. C</tspan><tspan x="70.0" y="139.6">unsigned wrap-around</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="265.0" y="84.4">Test</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="265.0" y="109.6">differential test vs real</tspan><tspan x="265.0" y="124.6">Python on &gt;=50,000</tspan><tspan x="265.0" y="139.6">tricky inputs</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="460.0" y="84.4">Prove</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="460.0" y="109.6">state + machine-check a</tspan><tspan x="460.0" y="124.6">nontrivial theorem; Lean</tspan><tspan x="460.0" y="139.6">checker gates the build</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="655.0" y="84.4">Check</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="655.0" y="109.6">independent second agent</tspan><tspan x="655.0" y="124.6">reviews; 'could a broken</tspan><tspan x="655.0" y="139.6">function pass?'</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#e03131" text-anchor="start"><tspan x="210.0" y="249.6">weak/vacuous proof -&gt; back to Copy (revise model)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="75.0" y="315.4">Project totals (CPython 3.15.2): 613,318 lines Lean / 1,539 files / 18,898 theorems / 4,071 accepted functions</tspan><tspan x="75.0" y="331.6">Coverage: grammar 100%, built-in types 35%, parser 31%, C modules 19%, interpreter core 10% -&gt; 16% overall</tspan><tspan x="75.0" y="347.9">Outcome: 418 bug reports, ~55 can crash the interpreter or corrupt memory from ordinary Python code</tspan></text>

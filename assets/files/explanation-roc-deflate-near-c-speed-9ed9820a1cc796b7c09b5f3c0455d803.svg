<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="150.0" y="39.2">roc-deflate vs libdeflate: 4 levers -&gt; within 2.6-8.9%</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="112.8">Silesia corpus</tspan><tspan x="55.0" y="132.8">144 benchmarks</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="295.0" y="107.8">roc-deflate (Roc, pure FP)</tspan><tspan x="295.0" y="127.8">no SIMD, no unsafe</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="575.0" y="107.8">median 8.9% slower (x64)</tspan><tspan x="575.0" y="127.8">2.6% slower (M1 arm64)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="295.0" y="202.8">libdeflate (C + arch SIMD)</tspan><tspan x="295.0" y="222.8">the end boss</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="296.0">Optimization levers that closed the gap:</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="342.0">1. Avoid unnecessary sharing</tspan><tspan x="55.0" y="360.8">-&gt; in-place mutation eligibility</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="412.0">2. Hoist bounds checks</tspan><tspan x="55.0" y="430.8">early-return before loop</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="482.0">3. Compile-time lookup tables</tspan><tspan x="55.0" y="500.8">+ exhaustive pattern match</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="55.0" y="552.0">4. Wrapping arithmetic</tspan><tspan x="55.0" y="570.8">plus_wrap vs plus (1 CPU instr)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="420.0" y="344.4">Remaining gap: arch-specific SIMD</tspan><tspan x="420.0" y="366.9">(the one thing pure FP can't touch)</tspan></text>
</svg>
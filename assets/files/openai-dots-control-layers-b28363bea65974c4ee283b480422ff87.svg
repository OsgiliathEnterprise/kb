<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="300.4">no high-severity breaches or exfiltration in eval; details of flags undisclosed</tspan></text>

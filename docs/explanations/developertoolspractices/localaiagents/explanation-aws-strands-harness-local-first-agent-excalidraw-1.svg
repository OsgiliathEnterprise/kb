<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="32.8">Strands Harness — local-first agent harness (AWS open source)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="52.0" y="107.8">CLI: recommend + /export</tspan><tspan x="52.0" y="127.8">-&gt; create_harness(...)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="272.0" y="107.8">Harness: loop + tools</tspan><tspan x="272.0" y="127.8">+ guardrails + steering</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="492.0" y="107.8">Any model: Bedrock,</tspan><tspan x="492.0" y="127.8">Anthropic, Ollama (local)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="712.0" y="107.8">MemoryStore interface</tspan><tspan x="712.0" y="127.8">Local / Bedrock KB</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="492.0" y="227.8">Sessions: ./.agent/sessions</tspan><tspan x="492.0" y="247.8">resume by id</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="302.8">Default harness: shell/file/web tools + prompt caching + context mgmt + memory + generalist subagent + todos.</tspan><tspan x="40.0" y="322.8">LocalMemoryStore = lexical recall (keyword match), not semantic — bring your own store for embeddings.</tspan></text>

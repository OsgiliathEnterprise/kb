<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="27.8">Nix wrote half of my debugger — Rewind VM pipeline</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="50.0" y="77.6">Nix derivation (flake ref OK)</tspan><tspan x="50.0" y="92.6">inputs = source, compiler, libs,</tspan><tspan x="50.0" y="107.6">kernel, VM config</tspan><tspan x="50.0" y="122.6">run id = hash of inputs (store-path style)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="410.0" y="77.6">rewind nix</tspan><tspan x="410.0" y="92.6">closure → read-only erofs image</tspan><tspan x="410.0" y="107.6">boot deterministic VM</tspan><tspan x="410.0" y="122.6">NAR hash of outputs checked vs store</tspan><tspan x="410.0" y="137.6">and vs .narinfo of every binary cache</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="770.0" y="77.6">rewind check --where</tspan><tspan x="770.0" y="92.6">perturbed schedules; reschedule at step N</tspan><tspan x="770.0" y="107.6">runs identical until the deciding step</tspan><tspan x="770.0" y="122.6">rewind where / rewind gdb on a fork</tspan><tspan x="770.0" y="137.6">bookmarks travel in .rwd export</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="start"><tspan x="410.0" y="257.6">sources + symbols for free</tspan><tspan x="410.0" y="272.6">nixpkgs separateDebugInfo → cache.nixos.org</tspan><tspan x="410.0" y="287.6">debuginfod fetches by build ID</tspan><tspan x="410.0" y="302.6">source of any binary in the VM</tspan><tspan x="410.0" y="317.6">— including the Linux kernel</tspan></text>

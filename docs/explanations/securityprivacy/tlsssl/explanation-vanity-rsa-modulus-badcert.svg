<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="120.0" y="26.0">Vanity RSA modulus: hiding a message in a CA-signed certificate</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="93.5">1. Pick random primes p, q; compute n = p x q</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="164.7">2. Overwrite bytes in the UPPER HALF of n with the</tspan><tspan x="160.0" y="182.2">base64 message (the only CA-unchecked part)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="244.7">3. Set q' = next prime near n/p (moves only low bits,</tspan><tspan x="160.0" y="262.2">n keeps the embedded text)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="324.7">4. Rebuild RSA key from (p, q'); check n still contains</tspan><tspan x="160.0" y="342.2">the message; retry alignment (&lt;4 attempts)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="404.7">5. openssl req -new -key priv.pem -subj '/CN=...' &gt; csr</tspan><tspan x="160.0" y="422.2">certbot certonly --manual --csr csr</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="484.7">6. CA-signed certificate whose PEM public key</tspan><tspan x="160.0" y="502.2">reads as a message (--no one checks these things--)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="755.0" y="85.4">Security caveats:</tspan><tspan x="755.0" y="101.7">- entropy reduced (2/3 of n</tspan><tspan x="755.0" y="117.9">  fixed = state-of-the-art</tspan><tspan x="755.0" y="134.2">  key-compression limit)</tspan><tspan x="755.0" y="150.4">- p, q' may end up close</tspan><tspan x="755.0" y="166.7">  (Fermat factorization)</tspan><tspan x="755.0" y="182.9">- tiny d possible</tspan><tspan x="755.0" y="199.2">- script checks none of this</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="755.0" y="315.4">Still fine for eavesdropping</tspan><tspan x="755.0" y="331.6">threats: TLS 1.3 forward</tspan><tspan x="755.0" y="347.9">secrecy pins ECDHE anyway</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="272.0" y="107.8">Server: atomic claim</tspan><tspan x="272.0" y="127.8">(subjectId, operationId)</tspan></text>

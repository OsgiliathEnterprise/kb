<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="100.2">Agent GET https://api.search.brave.com/...</tspan><tspan x="70.0" y="117.7">(no API key, no account)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="218.2">Server: HTTP 402 Payment Required</tspan><tspan x="70.0" y="235.7">PAYMENT-REQUIRED header (b64 PaymentRequired:</tspan><tspan x="70.0" y="253.2">price, payTo, network=base, scheme=exact)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="336.2">Agent signs USDC payment for that amount</tspan><tspan x="70.0" y="353.7">(Purl CLI wallet / x402 client)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="454.2">Retry same request with payment attached</tspan><tspan x="70.0" y="471.7">(PAYMENT-SIGNATURE header)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="572.2">Facilitator (Brave runs its own) verifies</tspan><tspan x="70.0" y="589.7">signature, settles on Base blockchain</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="70.0" y="690.2">200 OK: search results + on-chain</tspan><tspan x="70.0" y="707.7">transaction receipt</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="610.0" y="126.2">gather context (time of day…)</tspan><tspan x="610.0" y="143.7">planner drafts plan = graph of</tspan><tspan x="610.0" y="161.2">approved capability steps</tspan><tspan x="610.0" y="178.7">validate: producers, no loops,</tspan><tspan x="610.0" y="196.2">one terminal page</tspan><tspan x="610.0" y="213.7">fetch only needed Memory Hub data</tspan></text>

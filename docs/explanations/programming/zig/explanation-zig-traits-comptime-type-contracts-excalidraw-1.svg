<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="27.8">Zig polymorphism: three ways to write the same mobius function</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="150.0" y="101.2">Dynamic interfaces</tspan><tspan x="150.0" y="118.7">opaque ptr + vtable</tspan><tspan x="150.0" y="136.2">runtime dispatch</tspan><tspan x="150.0" y="153.7">modular, but compiler barrier</tspan><tspan x="150.0" y="171.2">+ perf overhead</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="410.0" y="110.0">Comptime duck typing</tspan><tspan x="410.0" y="127.5">anytype / T + reflection</tspan><tspan x="410.0" y="144.9">monomorphized, checked at compile time</tspan><tspan x="410.0" y="162.4">contract IMPLICIT (documented by hand)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="670.0" y="110.0">Traits (convention)</tspan><tspan x="670.0" y="127.5">struct of comptime functions</tspan><tspan x="670.0" y="144.9">explicit contract, inlined + unrolled</tspan><tspan x="670.0" y="162.4">no associated types, no type erasure</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="540.0" y="282.4">Warning: deep comptime nesting -&gt; templated-assembly explosion</tspan><tspan x="540.0" y="299.9">binary bloat, cache thrash, vtables can win</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="80.0" y="89.4">Pod layer</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="115.0" y="151.2">Pod A</tspan><tspan x="115.0" y="168.7">NetworkPolicy</tspan><tspan x="115.0" y="186.2">(podSelector)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="335.0" y="151.2">Pod B</tspan><tspan x="335.0" y="168.7">NetworkPolicy</tspan><tspan x="335.0" y="186.2">(podSelector)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="635.0" y="145.4">hostNetwork pod</tspan><tspan x="635.0" y="161.7">bypasses Cilium policy</tspan><tspan x="635.0" y="177.9">by default -&gt; needs</tspan><tspan x="635.0" y="194.2">host policies</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="80.0" y="349.4">Node (host endpoint) layer  -  hostFirewall.enabled=false BY DEFAULT!</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="115.0" y="410.4">CiliumClusterwideNetworkPolicy</tspan><tspan x="115.0" y="426.6">+ nodeSelector (e.g. node-access=ssh)</tspan><tspan x="115.0" y="442.9">enforces kubelet/etcd/SSH/node-port traffic</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="495.0" y="410.4">Policy Audit Mode</tspan><tspan x="495.0" y="426.6">= observation, NOT enforcement</tspan><tspan x="495.0" y="442.9">does NOT survive cilium-agent restart</tspan><tspan x="495.0" y="459.1">(silently flips to enforcing)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="910.0" y="395.4">lateral / mgmt-</tspan><tspan x="910.0" y="411.6">network traffic</tspan><tspan x="910.0" y="427.9">(deny unless allowed)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="310.0" y="285.4">two layers must be tested together</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="541.2">Before first enforcement: verify console/IPMI/serial out-of-band access (mistake can lock you out).</tspan></text>

<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="27.8">Go 1.27 JSON stack: semantics (encoding/json/v2) over syntax (encoding/json/jsontext)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="93.2">Your Go types + MarshalTo/UnmarshalFrom</tspan><tspan x="72.0" y="110.7">(apps use MarshalJSONTo / UnmarshalJSONFrom streaming interfaces)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="193.2">encoding/json/v2  — semantics: JSON value &lt;-&gt; Go value (reflection)</tspan><tspan x="72.0" y="210.7">rejects invalid UTF-8 + duplicate names by default; nil slices/maps -&gt; [] / {}</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="293.2">encoding/json/jsontext  — syntax only, no reflection: streaming</tspan><tspan x="72.0" y="310.7">Encoder/Decoder over io.Writer/io.Reader; Value ([]byte) + allocation-free Token</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1e1e1e" text-anchor="start"><tspan x="72.0" y="393.2">io.Reader / io.Writer  (true streaming; no whole-value buffering)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#e03131" text-anchor="start"><tspan x="752.0" y="93.2">v1 = encoding/json</tspan><tspan x="752.0" y="110.7">(frozen, Go 1 compat)</tspan><tspan x="752.0" y="128.2"> </tspan><tspan x="752.0" y="145.7">flaws kept:</tspan><tspan x="752.0" y="163.2">- accepts invalid UTF-8</tspan><tspan x="752.0" y="180.7">- accepts duplicate keys</tspan><tspan x="752.0" y="198.2">  (CVE-2017-12635 class)</tspan><tspan x="752.0" y="215.7">- nil slice/map -&gt; null</tspan><tspan x="752.0" y="233.2">- case-insensitive match</tspan><tspan x="752.0" y="250.7">- MarshalJSON forces</tspan><tspan x="752.0" y="268.2">  []byte alloc; quadratic</tspan><tspan x="752.0" y="285.7">  if it recurses into Marshal</tspan></text>
</svg>
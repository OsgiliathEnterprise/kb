<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start"><tspan x="60.0" y="36.0">One range flag, stored in two places - fix both</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="210.0" y="112.5">H.264 bitstream (VUI)</tspan><tspan x="210.0" y="129.9">video_full_range_flag</tspan><tspan x="210.0" y="147.4">fix: ffmpeg -bsf:v h264_metadata=...</tspan><tspan x="210.0" y="164.9">read: ffprobe -show_frames</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="570.0" y="112.5">MP4 container (colr box)</tspan><tspan x="570.0" y="129.9">colour_primaries/range metadata</tspan><tspan x="570.0" y="147.4">fix: ffmpeg -color_range tv</tspan><tspan x="570.0" y="164.9">read: ffprobe -show_streams</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#e8590c" text-anchor="middle"><tspan x="380.0" y="253.7">Ground truth = pixels</tspan><tspan x="380.0" y="271.2">signalstats YMIN/YMAX</tspan><tspan x="380.0" y="288.7">(16-235 = limited, 0-255 = full)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#7048e8" text-anchor="middle"><tspan x="380.0" y="383.7">Decoder picks one or both</tspan><tspan x="380.0" y="401.2">mismatch with pixels -&gt;</tspan><tspan x="380.0" y="418.7">grey blacks (foggy) or crushed</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#495057" text-anchor="start"><tspan x="60.0" y="460.4">-c copy = no re-encode, no generation loss. Container-only fix leaves -show_streams saying 'pc' -&gt; upload validators re-'fix' it back.</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="40.8">gVisor: a user-space kernel between untrusted containers and the host</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="124.4">Untrusted container</tspan><tspan x="160.0" y="146.9">(AI-agent generated code)</tspan><tspan x="160.0" y="169.4">app makes syscalls</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="304.8">Sentry — gVisor user-space kernel (Go)</tspan><tspan x="160.0" y="324.8">intercepts + services most syscalls itself</tspan><tspan x="160.0" y="344.8">(netstack for TCP/IP, gofer for files)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="18" fill="#1e1e1e" text-anchor="start"><tspan x="160.0" y="504.4">Host Linux kernel</tspan><tspan x="160.0" y="526.9">sees only the Sentry process,</tspan><tspan x="160.0" y="549.4">not the container's syscalls</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="700.0" y="307.8">Kubernetes opt-in path</tspan><tspan x="700.0" y="327.8"> </tspan><tspan x="700.0" y="347.8">Pod: runtimeClassName: gvisor</tspan><tspan x="700.0" y="367.8">  -&gt; RuntimeClass {handler: runsc}</tspan><tspan x="700.0" y="387.8">  -&gt; containerd handler runsc</tspan><tspan x="700.0" y="407.8">  -&gt; containerd-shim-runsc-v1</tspan><tspan x="700.0" y="427.8">  -&gt; runsc (Sentry)</tspan><tspan x="700.0" y="447.8"> </tspan><tspan x="700.0" y="467.8">Same mechanism as GKE Sandbox;</tspan><tspan x="700.0" y="487.8">Minikube ships a gVisor addon</tspan></text>
</svg>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="140.0" y="22.8">AEGIS: five-layer sanitization proxy in front of LLM endpoints</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="460.0" y="81.6">Incoming untrusted payload (text / PDF / image / web search)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="460.0" y="143.6">L1: Magika deep MIME + polyglot verification</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="460.0" y="195.6">L2: dual-stream OCR + hidden-text extractor</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="460.0" y="247.6">L3: Presidio + regex PII scrubber -&gt; &lt;EMAIL&gt; &lt;PHONE&gt; &lt;API_KEY&gt;</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="460.0" y="299.6">L4: fine-tuned Gemma 3 (LoRA, 4-bit) injection classifier</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="460.0" y="351.6">L5: sanitized web retrieval via SerpApi</tspan></text>

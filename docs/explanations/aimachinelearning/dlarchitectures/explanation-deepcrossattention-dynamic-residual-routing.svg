<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#e8590c" text-anchor="start"><tspan x="120.0" y="200.4">every prior layer added with weight 1</tspan><tspan x="120.0" y="216.7">-&gt; information dilution</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="625.0" y="102.8">DCA: per-token learned weights W over full layer history</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="638.0" y="155.0">Layer N (sum: input + output)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="638.0" y="250.0">Layer N-1</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="638.0" y="345.0">Layer N-2</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start"><tspan x="638.0" y="440.0">Layer 1 (input)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="935.0" y="252.4">routing module</tspan><tspan x="935.0" y="268.6">static learnable base +</tspan><tspan x="935.0" y="284.9">input-dependent projection</tspan><tspan x="935.0" y="301.1">(&gt;0.2% params)</tspan></text>

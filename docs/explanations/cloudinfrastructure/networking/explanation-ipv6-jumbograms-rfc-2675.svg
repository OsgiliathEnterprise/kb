<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="26" fill="#1e1e1e" text-anchor="start"><tspan x="120.0" y="40.8">IPv6 Jumbogram (RFC 2675) — packet layout and length signaling</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="135.0" y="112.8">IPv6 header (40 B)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#e03131" text-anchor="start"><tspan x="140.0" y="143.4">Payload Length = 0</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="840.0" y="143.4">Next Header = 0 (Hop-by-Hop)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="135.0" y="222.8">Hop-by-Hop Options header</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="158.0" y="259.4">Opt Type 0xC2</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="303.0" y="259.4">Data Len = 4</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#1e1e1e" text-anchor="start"><tspan x="468.0" y="259.4">Jumbo Payload Length: 32-bit, &gt; 65,535</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="start"><tspan x="135.0" y="357.8">Upper-layer segment  ·  TCP / UDP (with RFC 2675 enhancements)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="13" fill="#c92a2a" text-anchor="start"><tspan x="858.0" y="356.4">UDP Length field = 0  (jumbo flag)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="120.0" y="442.0">Valid only on links with MTU &gt; 65,575 (65,535 + 40) · never with a Fragment header</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="120.0" y="472.0">Checksum pseudo-header uses Jumbo Payload Length · 16-bit checksum weakens as data grows</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="15" fill="#495057" text-anchor="start"><tspan x="120.0" y="502.0">Malformed combos → ICMPv6 Parameter Problem (prescribed Code/Pointer per error)</tspan></text>

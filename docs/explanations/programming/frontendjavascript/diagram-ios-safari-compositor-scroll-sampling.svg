<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="22" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" y="37.6">iOS Safari 120 Hz workaround: compositor scroll -&gt; JS controller</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="125.0" y="142.8">finger / digitizer</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="355.0" y="132.8">scroll compositor thread</tspan><tspan x="355.0" y="152.8">(no JS round-trip)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="600.0" y="132.8">invisible background</tspan><tspan x="600.0" y="152.8">scroller -&gt; ProMotion 120 Hz</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="830.0" y="142.8">display @ 120 Hz</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="355.0" y="267.8">Controller: MessageChannel</tspan><tspan x="355.0" y="287.8">loop + setTimeout,</tspan><tspan x="355.0" y="307.8">phase-locked to rAF vsync</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="14" fill="#1971c2" text-anchor="start"><tspan x="275.0" y="185.2">scrollTop reads: 80/s -&gt; 90/s</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="635.0" y="277.8">empty rAF loop forces</tspan><tspan x="635.0" y="297.8">Safari IPC flush (no-ack path)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="875.0" y="277.8">custom animation</tspan><tspan x="875.0" y="297.8">@ ~118 FPS</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="250.0" y="437.8">Rejected: scroll events (5-26/s);</tspan><tspan x="250.0" y="457.8">raw MessageChannel (50k reads, 80 values,</tspan><tspan x="250.0" y="477.8">CPU pin); Atomics.wait (needs COOP/COEP)</tspan></text>
<text font-family="Excalifont, 'Segoe UI', sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="730.0" y="437.8">Recipe: scrollable region = input device</tspan><tspan x="730.0" y="457.8">trackpad / momentum trackball /</tspan><tspan x="730.0" y="477.8">bounce via overscroll / snap-point dial</tspan></text>
